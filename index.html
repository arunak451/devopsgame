say:[
{s:"A cold start happens when Lambda has no warm execution environment available, so it has to create one: download the code, start the runtime, and run the initialisation code outside the handler. That adds latency, from around a hundred milliseconds to a few seconds, especially for Java or large packages, or functions inside a VPC in the past. To reduce it, I keep the deployment package small, choose a lighter runtime, move heavy initialisation outside the handler so it's reused, and increase memory, which also gives more CPU. For latency-sensitive APIs I use provisioned concurrency, and for Java, SnapStart.",c:"'Enna' (definition) and 'reduce panna 3-4 vazhi' rendum. Provisioned concurrency kandippa sollu."},
{s:"Standard queues offer nearly unlimited throughput, at-least-once delivery, and best-effort ordering, so a message might be delivered twice or out of order, and the consumer should be idempotent. FIFO queues guarantee exactly-once processing and strict ordering within a message group, but with lower throughput, around 300 messages per second per API action, or more with batching and high-throughput mode. So I use Standard for things like sending emails or processing images, and FIFO when order matters, like financial transactions or order status updates. In both I'd configure a dead-letter queue for messages that keep failing.",c:"'Consumer idempotent ah irukkanum' and 'DLQ' rendum sonna nee real system pathi yosikkira."},
{s:"CloudWatch is about performance and health. It collects metrics, logs and events from resources and applications, and I use it for dashboards and alarms, like CPU above 80 percent or 5xx errors on the load balancer. CloudTrail is about auditing. It records API calls in the account: who did what, when, and from where. So if a server is slow, I look at CloudWatch. If a security group was changed or an instance was terminated and I need to know who did it, I look at CloudTrail.",c:"'CloudWatch = how is it performing, CloudTrail = who did what' oru line answer, apram example."},
{s:"Both run containers on AWS. ECS is AWS's own orchestrator. It's simpler, has no control plane cost, integrates tightly with AWS services like IAM, ALB and CloudWatch, and is quick to learn. EKS is managed Kubernetes. It's more complex and there's a control plane fee, but it's the industry standard, portable across clouds, and has a huge ecosystem like Helm, Argo CD and Prometheus. For a small team that's all-in on AWS, I'd pick ECS with Fargate. If the team already knows Kubernetes, needs portability or the ecosystem, I'd pick EKS.",c:"'Yaar team, enna need' nu situation base la choose pannu. Interviewer ku adhu dhaan pidikkum."},
{s:"The ASG runs health checks on every instance. By default it uses EC2 status checks, but I usually turn on ELB health checks so it also uses the load balancer's view, like the app returning 200 on a health path. When an instance is marked unhealthy, the ASG terminates it and launches a new one from the launch template to get back to the desired capacity, and the load balancer stops sending traffic to it as soon as it fails the target health check. A health check grace period gives new instances time to boot before they're checked. Lifecycle hooks can be used to grab logs before termination.",c:"'ELB health check enable pannuven' ndra point dhaan practical ah theriyum."}
],
lab:{title:"Serverless: Lambda triggered by S3, with logs and an alarm",time:"45 min",cost:"Free tier (a few invocations)",need:"The AWS account and CLI from earlier labs",
goal:"S3 la file upload panna automatic ah oru Lambda function run aagum. CloudWatch Logs la paaru. Error vandha email alert varum. Event-driven architecture oda live demo.",
steps:[
{t:"Create the function",d:"<b>Lambda → Create function → Author from scratch</b>: name <code>on-upload</code>, runtime <b>Python 3.12</b> (or latest), default role. Code tab la idha paste panni <b>Deploy</b>.",c:`import json

def lambda_handler(event, context):
    for record in event.get("Records", []):
        bucket = record["s3"]["bucket"]["name"]
        key = record["s3"]["object"]["key"]
        size = record["s3"]["object"].get("size", 0)
        print(f"New upload: s3://{bucket}/{key} ({size} bytes)")
        if key.endswith(".bad"):
            raise ValueError(f"Rejected file: {key}")
    return {"statusCode": 200, "body": json.dumps("ok")}`},
{t:"Test it",d:"<b>Test → Create new event → Template: S3 Put</b> → save → Test. 'Succeeded' and log output varum. Mudhal run la 'Init Duration' paaru, adhu dhaan cold start!",c:``},
{t:"Wire up the S3 trigger",d:"Pudhu bucket create pannu. Lambda → <b>Add trigger → S3</b> → bucket select → event <b>All object create events</b> → acknowledge. AWS automatic ah permission add pannum.",c:`aws s3 mb s3://yourname-events-lab-4821
echo hello > hello.txt
aws s3 cp hello.txt s3://yourname-events-lab-4821/`},
{t:"Read the logs",d:"<b>Monitor → View CloudWatch logs</b>, illana CLI la live ah follow pannu. 'New upload' line varum.",c:`aws logs tail /aws/lambda/on-upload --follow`},
{t:"Alarm on errors with SNS email",d:"<b>SNS → Topics → Create</b> (Standard) <code>lab-alerts</code> → <b>Create subscription</b> → Email → un email → mail la confirm pannu. <b>CloudWatch → Alarms → Create alarm</b> → metric <b>Lambda → By Function Name → on-upload → Errors</b> → Sum, 1 minute, <code>&gt;= 1</code> → notify <code>lab-alerts</code>.",c:``},
{t:"Trigger a failure",d:"<code>.bad</code> file upload pannu. Function error throw pannum, S3 async trigger 2 thadava retry pannum, 1-2 minutes la alarm email varum. Idhu dhaan real on-call experience!",c:`echo broken > test.bad
aws s3 cp test.bad s3://yourname-events-lab-4821/
aws logs tail /aws/lambda/on-upload --since 5m`},
{t:"Bonus: see who did what in CloudTrail",d:"<b>CloudTrail → Event history</b> → filter <b>Event name = CreateFunction</b> or <b>PutBucketNotificationConfiguration</b>. Un user name, time, IP ellam theriyum. 'CloudWatch vs CloudTrail' ku idhu dhaan live answer.",c:``}
],

kid:[
"Doctor ku patient pathi therinjukka 3 things: <b>Metrics</b> = numbers (temperature 101, heart rate 90), fast ah 'problem irukka?' nu sollum. <b>Logs</b> = patient diary, 'enna nadandhuchu' nu detail. <b>Traces</b> = oru request oda full journey map, 'endha department la late aachu?' (frontend → API → DB). Mooonum serndhaa dhaan <b>observability</b>.",
"<b>Prometheus</b> = oru nurse, ovvoru 15 seconds um ovvoru patient (server) kitta poi numbers note pannum (scrape/pull). <b>Exporters</b> = patient kitta irukura chinna machine, numbers ah ready ah vechirukkum (node-exporter = CPU, RAM, disk). <b>PromQL</b> = numbers kitta kelvi kekura language. <b>Grafana</b> = andha numbers ah azhagaana charts ah kaatura TV screen. <b>Alertmanager</b> = emergency bell.",
"<b>SLI</b> = actual ah measure panradhu: '100 requests la 99.95 success'. <b>SLO</b> = team target: '99.9% success irukkanum'. <b>SLA</b> = customer kooda contract: '99.5% kammi aana panam thirumba kudupom'. <b>Error budget</b> = 100% − 99.9% = 0.1%, month ku ~43 minutes 'thappu panna permission'. Budget irundha pudhu features release pannalaam, theerndhaa stability la focus.",
"Google SRE sonna 4 golden signals, 4 vital signs maadhiri: <b>Latency</b> = evlo neram aagudhu reply ku. <b>Traffic</b> = evlo requests varudhu. <b>Errors</b> = evlo fail aagudhu. <b>Saturation</b> = evlo full ah irukku (CPU, memory, queue). Indha 4 um dashboard la irundha, 90% problems udane theriyum.",
"<b>Incident</b> = fire. Mudhalla <b>fire ah anai</b> (mitigate: rollback, scale), apram <b>yen fire vandhuchu</b> nu paaru (root cause). <b>Postmortem</b> = blameless report, 'yaaru thappu' illa, 'enna system fix pannanum'. <b>DevSecOps</b> = security ah kadaisi la check pannaama, pipeline oda ovvoru step layum (code scan, image scan, secrets scan) check pannradhu, 'shift left'."
],
say:[
{s:"The SLI is the measurement. For example, the percentage of HTTP requests that return successfully in under 300 milliseconds. The SLO is our internal target for that SLI, say 99.9 percent over 30 days. The SLA is the external promise to customers, usually looser, like 99.5 percent, with consequences like service credits if we miss it. The gap between 100 percent and the SLO is the error budget, 0.1 percent, which is about 43 minutes a month. If we're within budget, we can ship features faster. If we've burned it, we slow down releases and focus on reliability. I'd alert on the burn rate of the error budget rather than on every small spike.",c:"Numbers vechu example sollu (99.9 → 43 min). 'Burn rate alert' sonna senior level."},
{s:"I'd start with the four golden signals: latency, traffic, errors and saturation. For metrics, I'd expose a /metrics endpoint with a Prometheus client library, or use CloudWatch, and build a Grafana dashboard with request rate, error rate, p95 and p99 latency, and CPU and memory. For logs, structured JSON logs with a request ID, shipped to something like Loki, ELK or CloudWatch Logs. For traces, OpenTelemetry so we can follow a request across services. Then I'd define SLOs with the team and set alerts on symptoms users feel, like a high error rate or the SLO burn rate, routed to on-call, with a runbook linked in every alert.",c:"Metrics → logs → traces → SLO → alerts → runbook. Order ah sollu."},
{s:"Situation: in my lab project, after I deployed a new version of my app to Kubernetes, the site started returning errors. Task: I was the one responsible, so I had to restore it fast and find out why. Action: I checked the pods and saw ImagePullBackOff, then kubectl describe showed the image tag didn't exist, because of a typo in the pipeline. I rolled back with kubectl rollout undo, which brought the site back within a couple of minutes. Then I fixed the tag, and added a step in CI that checks the image exists before deploying. Result: the site was back quickly, and that class of mistake can't reach the cluster again. I wrote a short postmortem with the timeline and the fix.",c:"Fresher ah irundha un lab la nadandha real problem ah STAR la sollu. Poi incident create pannaadha. 'Mitigate first, then root cause, then prevent' structure mukkiyam."},
{s:"Metrics are numbers over time. They're cheap to store and great for dashboards and alerting, so they tell me that something is wrong, like error rate going up. Logs are detailed records of individual events, so they tell me what exactly happened, like the stack trace for a specific error. Traces follow a single request across multiple services, so they tell me where the time is going or where it failed in a microservices system. In an incident, I'd usually get alerted by a metric, use traces to find the slow or failing service, and then logs to find the exact cause.",c:"'Metric = something is wrong, trace = where, log = why' indha flow romba pidikkum."},
{s:"DevSecOps means building security into every stage of the DevOps lifecycle instead of checking it only at the end, which is called shifting left. In practice, in the pipeline I'd run secret scanning like gitleaks, static code analysis with SonarQube or Semgrep, dependency scanning, and container image scanning with Trivy, and fail the build on critical findings. For infrastructure, I'd scan Terraform with tools like Checkov or tfsec. At runtime, least-privilege IAM, secrets in a secrets manager, network policies, and monitoring with tools like GuardDuty. The idea is security is everyone's job and it's automated, not a final gate.",c:"'Shift left' + pipeline la ovvoru stage ku oru tool. Tools names theriyum nu kaattu."}
],
lab:{title:"Prometheus + Grafana monitoring stack with an alert you trigger",time:"45 min",cost:"Free",need:"Docker Desktop",
goal:"Docker Compose la Prometheus, node-exporter, Grafana run panni, PromQL queries ezhudhi, dashboard import panni, oru service ah down panni 'up == 0' alert ah paakradhu.",
steps:[
{t:"Prometheus config",d:"<code>monitoring</code> nu folder create pannu. Adhula <code>prometheus.yml</code>: Prometheus ah thannaiyum node-exporter aiyum scrape panna sollu. <code>alert.rules.yml</code>: target down aana alert.",c:`# prometheus.yml
global:
  scrape_interval: 15s
rule_files:
  - alert.rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

# alert.rules.yml
groups:
  - name: lab
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is down"`},
{t:"Compose file",d:"Same folder la <code>compose.yaml</code>.",c:`services:
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
  node-exporter:
    image: prom/node-exporter:latest
    ports: ["9100:9100"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]`},
{t:"Start the stack",d:"<code>localhost:9090</code> → <b>Status → Targets</b> la rendu targets um <b>UP</b> ah irukkanum. <code>localhost:9100/metrics</code> la raw metrics paaru.",c:`docker compose up -d
docker compose ps`},
{t:"Ask questions with PromQL",d:"Prometheus UI la <b>Graph</b> tab la ovvonnum run pannu.",c:`up
rate(node_cpu_seconds_total{mode!="idle"}[5m])
100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
100 - 100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
rate(prometheus_http_requests_total[1m])`},
{t:"Grafana dashboard",d:"<code>localhost:3000</code> → login <code>admin / admin</code> → pudhu password. <b>Connections → Data sources → Add → Prometheus</b> → URL <code>http://prometheus:9090</code> → Save & test. <b>Dashboards → New → Import</b> → ID <code>1860</code> (Node Exporter Full) → Prometheus select → Import. Full server dashboard ready!",c:``},
{t:"Cause an incident",d:"node-exporter ah stop pannu. Prometheus <b>Alerts</b> page la TargetDown first <b>Pending</b>, 30s apram <b>Firing</b> aagum. Thirumba start pannu, resolve aagum. Real setup la Alertmanager idha Slack/PagerDuty ku anuppum.",c:`docker compose stop node-exporter
# watch localhost:9090/alerts
docker compose start node-exporter`},
{t:"Write a mini postmortem",d:"Notepad la 5 lines ezhudhu: <b>What happened, impact, timeline, root cause, action items</b>. Interview 'tell me about an incident' ku idhu ready material.",c:`Incident: node metrics missing for 2 min
Impact: no CPU/memory visibility (lab)
Timeline: 10:02 stopped, 10:02:45 alert fired, 10:04 restarted, 10:04:30 resolved
Root cause: exporter container stopped
Action items: alert on up==0 (done), add restart: unless-stopped`}
],

kid:[
"System design question = 'oru periya kalyana mandapam design pannu' maadhiri. Udane chairs count pannaadha! Mudhalla <b>kelu</b>: evlo guests (users)? Veg/non-veg (requirements)? Budget? Apram <b>simple plan</b> draw pannu, apram <b>problems yosichu</b> improve pannu (crowd adhigam aana? current pona?). Kelvi kekradhu weakness illa, adhu dhaan senior style.",
"<b>STAR</b> = story solra recipe. <b>S</b>ituation = enga, enna nadandhuchu. <b>T</b>ask = un responsibility enna. <b>A</b>ction = <b>nee</b> enna pannina (idhu dhaan 60%, 'we' illa 'I'). <b>R</b>esult = enna result, number irundha best (downtime 2 hours → 10 min). 2 minutes la mudikkanum.",
"Certificate vida <b>project</b> dhaan pesum. Oru project ah end to end pannu: app → Docker → GitHub Actions → Terraform la AWS → Kubernetes/ECS → monitoring. GitHub la README with diagram podu. Interviewer 'your project pathi sollu' nu ketta, nee 20 minutes confident ah pesalaam. Indha game labs ellam pannaa, adhuve un project!",
"<b>RTO</b> = fire vandhaa, evlo neram la kadai thirumba open aaganum (downtime limit). <b>RPO</b> = evlo neram data tholainjaalum paravaillai (last backup eppo). Strategies, cheap to costly: <b>Backup & restore</b> (hours) → <b>Pilot light</b> (chinna light eppovum on) → <b>Warm standby</b> (chinna copy odikittu irukkum) → <b>Multi-site active-active</b> (rendu kadai um full ah open, seconds)."

say:[
{s:"Before designing, I'd clarify requirements: expected users and traffic, read versus write ratio, availability target, latency, data size and budget. Then, starting simple: Route 53 for DNS, CloudFront in front for static content and caching, with AWS WAF for protection. An Application Load Balancer across at least two Availability Zones, sending traffic to an Auto Scaling group of EC2 instances, or ECS on Fargate, in private subnets. For data, RDS or Aurora with Multi-AZ, read replicas for read-heavy traffic, and ElastiCache in front for hot data. Static files and uploads in S3. For background work, SQS to decouple and absorb spikes. Everything in Terraform, deployed through CI/CD, with CloudWatch monitoring, alarms on the golden signals, and backups. If the requirement is multi-region, I'd add a second region with Aurora Global Database and Route 53 failover. Then I'd talk through trade-offs, like cost versus availability.",c:"Clarify → simple → scale → reliability → security → monitoring → trade-offs. Whiteboard la box draw pannitu pesu. Udane services list pannaadha."},
{s:"I'm a DevOps fresher with a strong hands-on foundation. Over the past months, I've learned Linux, networking and Git, and built a complete project: I containerised a web application with Docker, deployed it to Kubernetes, and set up a GitHub Actions pipeline that tests it, scans for secrets, and deploys it automatically. On AWS, I've worked with IAM, EC2, a custom VPC, S3 with CloudFront, and Lambda, and I provision infrastructure with Terraform. I also set up monitoring with Prometheus and Grafana. What I enjoy most is automating things and troubleshooting when they break. I'm looking for a role where I can keep learning from experienced engineers and contribute to reliable, automated systems.",c:"Present (who I am) → past (what I built) → future (why this job). 90 seconds max. Family, school marks history venaam, project pathi dhaan pesanum."},
{s:"My project is a DevOps learning game, a single-page web app. I started by putting it in Git with a pull-request workflow and branch protection. I containerised it with a small nginx-alpine Docker image. Then I built a GitHub Actions pipeline: on every pull request it validates the code and runs gitleaks secret scanning, and on merge to main it deploys automatically to GitHub Pages, and also builds and pushes a Docker image tagged with the commit SHA. I deployed the same image to Kubernetes with a Deployment, a Service, readiness probes and resource limits, and practised rolling updates and rollbacks. On AWS, I provisioned resources with Terraform and served the site from a private S3 bucket through CloudFront. And I monitored it with Prometheus and Grafana. The biggest challenge was a broken deploy from a wrong image tag, which taught me to always check rollouts and keep rollback ready.",c:"Indha answer ah un actual ah panna labs mattum vechu ezhudhu. Panna part mattum sollu, interviewer deep ah kepaanga. Oru 'challenge' and 'what I learned' kandippa add pannu."},
{s:"I like DevOps because it sits between development and operations, and I enjoy both building things and keeping them running. What attracted me most is automation. I like taking something that's manual and error-prone, like deploying an app, and turning it into a pipeline that does it reliably every time. When I built my own CI/CD pipeline and saw a merge deploy automatically, that was the moment I knew this is what I want to do. I also like that it's always evolving, cloud, containers, IaC, so there's always something new to learn, and I enjoy that.",c:"'Salary/demand' sollaadha. Un oru real moment (pipeline first time work aanadhu) sollu. Genuine ah irukkanum."},
{s:"In the first 30 days, my focus would be to learn and listen. I'd understand the architecture and how code gets from a developer's laptop to production. I'd read the runbooks, past postmortems and documentation, get access set up properly, and shadow the on-call engineer. I'd try to pick up small tickets early, like fixing a pipeline issue or improving documentation, so I start contributing and learning the systems hands-on. And I'd ask a lot of questions and note down anything confusing, because a fresh pair of eyes often finds documentation gaps that I could help fix.",c:"'Learn, then contribute small, then improve' nu sollu. 'Ellathaiyum maathuven' nu sollaadha."}
],

/* ================= QUESTION RENDERING ================= */
function norm(s){return s.trim().replace(/\s+/g," ").replace(/;$/,"").replace(/^\$ /,"").replace(/^sudo /,"")}
function renderQ(q,host,onDone){
 const labels={mcq:"Multiple choice",cmd:"Terminal",ord:"Put in order"};
 host.innerHTML=`<div class="qtype">${labels[q.k]}</div><div class="qtext">${esc(q.q)}</div><div id="qa"></div><div id="fbk"></div>`;
 const qa=host.querySelector("#qa"),fbk=host.querySelector("#fbk");
 let answered=false;
 const finish=(ok,correctText)=>{
  if(answered)return;answered=true;
  fbk.innerHTML=`<div class="fb ${ok?"good":"bad"}"><h4>${ok?"Correct":"Not quite"}</h4>${!ok&&correctText?`<p style="margin-bottom:6px">Answer: <code>${esc(correctText)}</code></p>`:""}<p>${esc(q.e)}</p></div>`;
  onDone(ok);
 };
 if(q.k==="mcq"){
  const order=shuffle(q.o.map((t,i)=>i));
  qa.innerHTML=`<div class="opts">${order.map((oi,n)=>`<button class="opt" data-i="${oi}"><span class="k">${n+1}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>`;
  const btns=[...qa.querySelectorAll(".opt")];
  const pick=b=>{if(answered)return;const ok=+b.dataset.i===q.a;btns.forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("right")});if(!ok)b.classList.add("wrong");finish(ok)};
  btns.forEach(b=>b.onclick=()=>pick(b));
  renderQ.key=e=>{const n=+e.key;if(n>=1&&n<=btns.length&&!answered)pick(btns[n-1])};
 }else if(q.k==="cmd"){
  qa.innerHTML=`<div class="term"><div class="ln"><span class="ps">ops@prod:~$</span><input id="cmdin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the command"></div><div class="out" id="cmdout"></div></div>
  <div class="actions" id="cmdact"><button class="btn" id="run">Run ⏎</button><button class="btn ghost" id="hint">Show answer</button></div>`;
  const inp=qa.querySelector("#cmdin");inp.focus();
  const run=()=>{if(answered)return;const v=norm(inp.value);if(!v)return;const ok=q.a.some(r=>r.test(v));
   qa.querySelector("#cmdout").textContent=ok?"✓ command accepted":"✗ "+v+": that's not it";inp.disabled=true;qa.querySelector("#cmdact").hidden=true;finish(ok,q.ans)};
  inp.onkeydown=e=>{if(e.key==="Enter")run()};
  qa.querySelector("#run").onclick=run;
  qa.querySelector("#hint").onclick=()=>{inp.disabled=true;qa.querySelector("#cmdact").hidden=true;finish(false,q.ans)};
  renderQ.key=null;
 }else{
  let picked=[];const pool=shuffle(q.o);
  const draw=()=>{
   qa.innerHTML=`<div class="eyebrow" style="margin-bottom:6px">Your order (tap to remove)</div><div class="ord-picked">${picked.map((t,n)=>`<button class="ord-item" data-t="${esc(t)}"><b>${n+1}</b>${esc(t)}</button>`).join("")||'<span class="muted" style="padding:4px">Tap steps below in the right order</span>'}</div>
   <div class="ord-pool">${pool.filter(t=>!picked.includes(t)).map(t=>`<button class="ord-item" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
   <div class="actions"><button class="btn" id="chk" ${picked.length===q.o.length?"":"disabled"}>Check order</button></div>`;
   qa.querySelectorAll(".ord-picked .ord-item").forEach(b=>b.onclick=()=>{if(answered)return;picked=picked.filter(t=>t!==b.dataset.t);draw()});
   qa.querySelectorAll(".ord-pool .ord-item").forEach(b=>b.onclick=()=>{if(answered)return;picked.push(b.dataset.t);draw()});
   qa.querySelector("#chk").onclick=()=>{const ok=picked.every((t,n)=>t===q.o[n]);
    qa.innerHTML=`<div class="ord-picked">${picked.map((t,n)=>`<div class="ord-item" style="border-color:${t===q.o[n]?"var(--ok)":"var(--bad)"}"><b>${n+1}</b>${esc(t)}</div>`).join("")}</div>`;
    finish(ok,ok?null:q.o.map((t,n)=>(n+1)+". "+t).join("  →  "))};
  };draw();renderQ.key=null;
 }
}
document.addEventListener("keydown",e=>{if(renderQ.key&&!/INPUT/.test(document.activeElement.tagName))renderQ.key(e)});

function mission(id){
 stopTimer();
 const z=Z[zi(id)];const qs=z.mission;let n=0,up=100,wrong=0,earned=0;
 app().innerHTML=`<button class="back" id="bk">← Abort mission</button>
 <div class="mbar"><div class="uptime"><div class="lab"><span>${z.name} · SLA uptime</span><span id="upv">100%</span></div><div class="bar"><i id="upb" style="width:100%"></i></div></div>
  <span class="chip" id="qn"></span></div>
 <div class="qcard" id="qc"></div><div class="actions" id="nav"></div>`;
 $("#bk").onclick=()=>zone(id);
 const step=()=>{
  $("#qn").textContent="Q "+(n+1)+" / "+qs.length;$("#nav").innerHTML="";
  const q=qs[n];const qkey=id+"-m"+n;
  renderQ(q,$("#qc"),ok=>{
   renderQ.key=null;
   if(ok){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    if(!S.solved[qkey]){S.solved[qkey]=1;const x=q.k==="mcq"?20:30;earned+=x;addXP(x)}
    if(q.k==="cmd")S.cmdOk++;
   }else{S.streak=0;wrong++;up-=10}
   hud();checkBadges();save();
   $("#upv").textContent=up+"%";const b=$("#upb");b.style.width=up+"%";b.style.background=up>=90?"var(--ok)":up>=80?"var(--amber)":"var(--bad)";
   const failed=up<70,last=n===qs.length-1;
   $("#nav").innerHTML=`<button class="btn" id="nx">${failed?"See report":last?"Finish mission":"Next question →"}</button>`;
   const nx=$("#nx");nx.focus();
   nx.onclick=()=>{if(failed||last)result(id,!failed,wrong,earned);else{n++;step()}};
  });
 };step();
}
function result(id,pass,wrong,earned){

   ${pass?`<button class="btn" id="iv">Interview questions →</button>`:`<button class="btn" id="re">Retry mission</button><button class="btn ghost" id="br">Re-read briefing</button>`}

   <button class="btn ghost" id="hm">All zones</button>
  </div></div>`;
 if(pass){$("#iv").onclick=()=>zone(id,"iv");if(next)$("#nz").onclick=()=>zone(next.id)}

}

function sim(){
 stopTimer();
 const pool=[];Z.forEach((z,i)=>{if(S.cleared[z.id]||S.unlockAll)z.interview.forEach((q,k)=>pool.push({qid:z.id+"-"+k,q,z:z.name}))});
 if(pool.length<5){app().innerHTML=`<button class="back" id="bk">← Home</button><div class="card result"><h2>Clear a zone first</h2><p class="muted">The simulator asks questions from zones you've cleared (or all zones in revision mode). Clear Linux Ground Floor to unlock it.</p><div class="row"><button class="btn" id="go">Go to Linux</button></div></div>`;$("#bk").onclick=home;$("#go").onclick=()=>zone("linux");return}
 const qs=shuffle(pool).slice(0,10);let n=0,score=0;
 const step=()=>{
  stopTimer();const it=qs[n];let left=90;
  app().innerHTML=`<button class="back" id="bk">← Leave interview</button>
  <div class="mbar"><span class="chip">Question ${n+1} / ${qs.length}</span><span class="chip">${esc(it.z)}</span><span style="margin-left:auto" class="timer" id="tm">1:30</span></div>
  <p class="muted" style="margin-top:0">Answer out loud as if the interviewer is listening. Reveal when done or when time runs out.</p>
  <div id="ivh">${ivCard("sim-"+it.qid,it.q).replace(/hidden>Reveal/,">Reveal").replace('class="body" hidden','class="body" hidden')}</div>`;
  $("#bk").onclick=()=>{stopTimer();home()};
  const card=$("#ivh .iq");card.querySelector(".reveal").hidden=false;card.querySelector(".body").hidden=true;
  card.querySelectorAll(".rate button").forEach(b=>b.classList.remove("sel"));
  card.querySelector(".reveal").addEventListener("click",stopTimer);
  timerId=setInterval(()=>{left--;const t=$("#tm");if(!t){stopTimer();return}t.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");t.classList.toggle("low",left<=15);if(left<=0){stopTimer();card.querySelector(".reveal").click()}},1000);
  card.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
   const v=+b.dataset.v;score+=[0,0.5,1][v];
   if(v===0)S.iv[it.qid]=0;else if(S.iv[it.qid]==null)S.iv[it.qid]=v;save();
   n++;if(n<qs.length)step();else simDone(score,qs.length);
  });
 };step();
}
function simDone(score,total){
 const pct=Math.round(score/total*100);
 if(pct>S.simBest)S.simBest=pct;if(pct>=80)award("hired");if(pct>=60)addXP(50);save();
 const v=pct>=80?["Strong hire","var(--ok)","You explain clearly across topics. Keep practicing out loud and build your portfolio project."]:pct>=60?["Lean hire","var(--amber)","Solid base. Revisit the questions you marked Partly or Need revision."]:["Not yet","var(--bad)","Go back to the briefings for your weak zones, then try again. Every rep counts."];
 app().innerHTML=`<div class="result"><div class="eyebrow">Interview Simulator</div><div class="big" style="color:${v[1]}">${v[0]}</div>
 <p class="muted">${v[2]}</p><div class="kv"><div><b>${pct}%</b><span>this round</span></div><div><b>${S.simBest}%</b><span>best</span></div><div><b>${pct>=60?50:0}</b><span>XP earned</span></div></div>
 <div class="row"><button class="btn" id="again">New round</button><button class="btn ghost" id="rv">Revision list</button><button class="btn ghost" id="hm">Home</button></div></div>`;
 $("#again").onclick=sim;$("#rv").onclick=badges;$("#hm").onclick=home;
}

/* ================= COMMAND DRILL ================= */
function drill(){
 stopTimer();
 const pool=[];Z.forEach((z,i)=>{if(unlocked(i))z.mission.forEach(q=>{if(q.k==="cmd")pool.push(q)})});
 let qs=shuffle(pool),n=0,ok=0,left=60;
 app().innerHTML=`<button class="back" id="bk">← Stop drill</button>
 <div class="mbar"><span class="chip" id="sc">0 correct</span><span style="margin-left:auto" class="timer" id="tm">60</span></div>
 <div class="qcard"><div class="qtype">Command Drill</div><div class="qtext" id="dq"></div>
  <div class="term"><div class="ln"><span class="ps">ops@prod:~$</span><input id="din" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the command"></div><div class="out" id="dout"></div></div>
  <div class="actions"><button class="btn ghost" id="skip">Skip (shows answer)</button></div></div>`;
 $("#bk").onclick=()=>{stopTimer();home()};
 const inp=$("#din");
 const show=()=>{if(n>=qs.length){qs=shuffle(pool);n=0}$("#dq").textContent=qs[n].q;inp.value="";inp.focus()};
 inp.onkeydown=e=>{if(e.key!=="Enter")return;const v=norm(inp.value);if(!v)return;
  if(qs[n].a.some(r=>r.test(v))){ok++;S.cmdOk++;$("#sc").textContent=ok+" correct";$("#dout").textContent="✓ "+v;n++;show()}
  else{$("#dout").textContent="✗ try again (or skip)";}};
 $("#skip").onclick=()=>{$("#dout").textContent="answer was: "+qs[n].ans;n++;show()};
 show();
 timerId=setInterval(()=>{left--;const t=$("#tm");if(!t){stopTimer();return}t.textContent=left;t.classList.toggle("low",left<=10);
  if(left<=0){stopTimer();if(ok>S.drillBest)S.drillBest=ok;if(ok>=15)award("drill15");addXP(Math.min(ok*5,75));checkBadges();save();
   app().innerHTML=`<div class="result"><div class="eyebrow">Command Drill</div><div class="big">${ok} commands</div><p class="muted">Best so far: ${S.drillBest}. XP earned: ${Math.min(ok*5,75)}.</p>
   <div class="row"><button class="btn" id="again">Run it again</button><button class="btn ghost" id="hm">Home</button></div></div>`;
   $("#again").onclick=drill;$("#hm").onclick=home}},1000);
}

/* ================= BADGES & REVISION ================= */
function badges(){
 stopTimer();
 const rev=[];Z.forEach(z=>z.interview.forEach((q,k)=>{const id=z.id+"-"+k;if(S.iv[id]===0||S.iv[id]===1)rev.push({id,q,z:z.name,r:S.iv[id]})}));
 rev.sort((a,b)=>a.r-b.r);
 app().innerHTML=`<button class="back" id="bk">← Home</button>
 <div class="sec-h"><h2>Badges</h2><span class="muted">${S.badges.length}/${BADGES.length}</span></div>
 <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?"got":""}"><b>${b.n}</b><span>${b.d}</span></div>`).join("")}</div>
 <div class="kv" style="max-width:640px"><div><b>${S.xp}</b><span>total XP</span></div><div><b>${S.bestStreak}</b><span>best streak</span></div><div><b>${S.cmdOk}</b><span>commands typed right</span></div></div>
 <div class="sec-h" style="margin-top:28px"><h2>Revision list</h2><span class="muted">${rev.length} questions</span></div>
 <div id="rv">${rev.length?rev.map(x=>`<div class="eyebrow" style="margin:0 0 4px">${esc(x.z)}</div>`+ivCard(x.id,x.q)).join(""):'<p class="muted">Nothing here yet. Questions you rate "Partly" or "Need revision" appear here.</p>'}</div>
 <div style="margin-top:36px"><button class="btn ghost" id="rs">Reset all progress</button><div id="rsc"></div></div>`;
 $("#bk").onclick=home;bindIv($("#rv"));
 $("#rs").onclick=()=>{$("#rsc").innerHTML=`<div class="confirm"><span class="muted">This wipes XP, stars and badges.</span><button class="btn" id="yes" style="background:var(--bad)">Yes, reset</button><button class="btn ghost" id="no">Cancel</button></div>`;
  $("#yes").onclick=()=>{S=fresh();save();hud();home();toast("Progress reset")};$("#no").onclick=()=>$("#rsc").innerHTML=""};
}

/* ================= BOOT ================= */
function start(data){
 if(data&&data.S)S=Object.assign(fresh(),data.S);else load();
 try{window.claude?.hot?.snapshot(()=>({S}))}catch(e){}
 $("#logo").onclick=home;hud();home();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
