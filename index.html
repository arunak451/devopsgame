<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Call Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: night-shift ops console. Top status bar, zone map as a numbered career path, focused single-card mission runner. */
:root{
  --bg:#0e1320; --panel:#151c2c; --panel2:#1b2438; --line:#28334d;
  --fg:#e7eaf3; --muted:#8e98b0; --amber:#ffb547; --amber-ink:#2a1a00;
  --ok:#4fd1a1; --bad:#ff6b6b; --info:#7fa8ff;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.92em}
code{background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:#ffd79a}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.wrap{max-width:1040px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;margin-bottom:24px}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.08em;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.pager{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(255,181,71,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
.stats{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rank{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--amber)}
.xpbar{width:150px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:var(--amber);transition:width .5s}
.xptext{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}

/* generic */
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:14px}
.back:hover{color:var(--amber)}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-bottom:28px}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.08}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:var(--muted);max-width:56ch}
.ladder{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:13px}
.ladder div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;color:var(--muted)}
.ladder div.on{color:var(--fg)}
.ladder div.cur{background:var(--panel2);color:var(--amber);border:1px solid var(--line)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--amber)}
.mode b{font-family:var(--f-display);font-size:17px}
.mode span{color:var(--muted);font-size:13px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:22px}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.zone{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.zone:hover:not(.locked){border-color:var(--amber);transform:translateY(-2px)}
.zone{transition:transform .15s,border-color .15s}
.zone .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.zone h3{font-size:18px}
.zone p{margin:0;color:var(--muted);font-size:13px}
.zone .st{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px}
.zone.locked{opacity:.45;cursor:not-allowed}
.lvl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.lvl.Basics{color:var(--ok)} .lvl.Core{color:var(--info)} .lvl.Advanced{color:var(--amber)} .lvl.Boss{color:var(--bad)}
.stars{color:var(--amber);letter-spacing:2px}
.stars .off{color:var(--line)}

/* zone page */
.zhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.zhead h1{font-size:clamp(24px,3.6vw,34px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--amber)}
.concepts{display:flex;flex-direction:column;gap:14px}
.concept{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.concept h3{font-size:18px;margin-bottom:8px}
.concept p{margin:0 0 10px;max-width:72ch}
.tip{background:rgba(255,181,71,.08);border:1px dashed rgba(255,181,71,.4);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.tip b{color:var(--amber);font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:2px}
pre.snip{background:#0a0f19;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:10px 0 0;font-family:var(--f-mono);font-size:13px;color:#cfe3ff;line-height:1.5}

/* mission */
.mbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.uptime{flex:1;min-width:200px}
.uptime .lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:4px}
.uptime .bar{height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.uptime .bar i{display:block;height:100%;background:var(--ok);transition:width .4s,background .4s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:780px}
.qtype{font-family:var(--f-mono);font-size:12px;color:var(--info);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.qtext{font-size:18px;font-weight:500;margin-bottom:18px;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;flex:none;margin-top:2px}
.opt.right{border-color:var(--ok);background:rgba(79,209,161,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.1)}
.opt:disabled{cursor:default}
.term{background:#0a0f19;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--f-mono);font-size:14px}
.term .ln{display:flex;gap:8px;align-items:center}
.term .ps{color:var(--ok);white-space:nowrap}
.term input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;outline:none;caret-color:var(--amber)}
.term .out{color:var(--muted);margin-top:8px;white-space:pre-wrap}
.ord-pool,.ord-picked{display:flex;flex-direction:column;gap:6px}
.ord-picked{min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:12px}
.ord-item{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.ord-item:hover{border-color:var(--amber)}
.ord-picked .ord-item{border-color:var(--info)}
.ord-picked .ord-item b{font-family:var(--f-mono);color:var(--info);margin-right:8px}
.fb{margin-top:16px;border-radius:10px;padding:14px 16px;border:1px solid}
.fb.good{border-color:var(--ok);background:rgba(79,209,161,.08)}
.fb.bad{border-color:var(--bad);background:rgba(255,107,107,.08)}
.fb h4{margin:0 0 4px;font-family:var(--f-display);font-size:16px}
.fb p{margin:0}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}

/* interview */
.iq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;min-width:0}
.iq h3{font-size:17px;font-family:var(--f-body);font-weight:600;margin-bottom:10px}
.ans{border-left:3px solid var(--info);padding:4px 0 4px 14px;margin:10px 0;color:#d4dbec;max-width:75ch}
.ans ul{margin:6px 0;padding-left:20px}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.rate button.sel.r2{border-color:var(--ok);color:var(--ok)}
.rate button.sel.r1{border-color:var(--amber);color:var(--amber)}
.rate button.sel.r0{border-color:var(--bad);color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:28px;font-variant-numeric:tabular-nums;color:var(--amber)}
.timer.low{color:var(--bad)}

/* results / badges */
.result{max-width:640px}
.big{font-family:var(--f-display);font-size:clamp(30px,5vw,48px);line-height:1.05;margin:6px 0 10px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kv b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:28px}
.badge{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}
.badge b{font-family:var(--f-display);display:block}
.badge span{font-size:13px;color:var(--muted)}
.badge.got{border-color:var(--amber)}
.badge.got b{color:var(--amber)}
.badge:not(.got){opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--amber);color:var(--amber-ink);font-weight:600;padding:10px 18px;border-radius:99px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.confirm{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .modes{grid-template-columns:1fr}
  .stats{margin-left:0;width:100%}
  .xpbar{flex:1}
  .kv{grid-template-columns:1fr 1fr}
  .qcard{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* kid explanations, spoken answers, labs */
.kid{background:rgba(127,168,255,.08);border:1px dashed rgba(127,168,255,.45);border-radius:8px;padding:10px 12px;font-size:14px;margin:4px 0 12px;max-width:78ch}
.kid b.h,.say b.h,.coach b.h{color:var(--info);font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
.say{border-left:3px solid var(--ok);padding:4px 0 4px 14px;margin:14px 0 10px;max-width:75ch}
.say b.h{color:var(--ok)}
.say p{margin:0 0 8px;font-style:italic;color:#d4dbec}
.coach{background:rgba(255,181,71,.08);border:1px dashed rgba(255,181,71,.4);border-radius:8px;padding:10px 12px;font-size:14px;margin:6px 0 10px;max-width:75ch}
.coach b.h{color:var(--amber)}
.frame{margin-bottom:18px}
.frame ol{margin:8px 0 10px;padding-left:22px}
.frame li{margin-bottom:4px}
.frame .dont{color:var(--muted);font-size:14px;margin:0}
.labmeta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.warn{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.4);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
.warn b{color:var(--bad)}
.lstep{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.lstep.done{border-color:rgba(79,209,161,.55)}
.lstep input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);cursor:pointer}
.lstep h3{font-size:16px;font-family:var(--f-body);font-weight:600;margin:0 0 4px}
.lstep.done h3{color:var(--ok)}
.lstep p{margin:0 0 8px;max-width:75ch}
.lstep .snip{grid-column:2;margin:4px 0 0}
.lsteps{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.lbox{margin-top:16px}
.lbox h3{font-size:17px;margin-bottom:8px}
.lbox ul{margin:0;padding-left:20px}
.lbox li{margin-bottom:4px}
.lprog{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.lstep{grid-template-columns:1fr}.lstep .snip{grid-column:1}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="logo" id="logo" aria-label="Home"><span class="pager"></span>ON-CALL QUEST</button>
  <div class="stats">
    <span class="rank" id="rank">Intern</span>
    <div class="xpbar"><i id="xpfill" style="width:0"></i></div>
    <span class="xptext" id="xptext">0 XP</span>
    <span class="chip" id="streak">streak 0</span>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= CONTENT ================= */
const Z = [
{id:"linux",name:"Linux Ground Floor",lvl:"Basics",blurb:"Files, permissions, processes, logs. Every server you touch runs this.",
concepts:[
 {t:"The filesystem map",b:"<p>Everything starts at <code>/</code>. Configs live in <code>/etc</code>, logs in <code>/var/log</code>, user homes in <code>/home</code>, temp files in <code>/tmp</code>, installed binaries in <code>/usr/bin</code>.</p><p>Daily moves: <code>pwd</code>, <code>ls -la</code>, <code>cd</code>, <code>mkdir -p</code>, <code>cp -r</code>, <code>mv</code>, <code>rm -rf</code> (careful, no recycle bin).</p>",tip:"Linux oru periya veedu maathiri. / thaan main gate, /etc la settings, /var/log la CCTV footage (logs).",code:"cd /var/log && ls -la\nmkdir -p /opt/app/releases\ncp -r config/ /etc/myapp/"},
 {t:"Permissions: rwx and 755",b:"<p>Every file has 3 sets of permissions: <b>owner</b>, <b>group</b>, <b>others</b>. Each set is r(4) + w(2) + x(1). So <code>755</code> = owner rwx (7), group r-x (5), others r-x (5).</p><p><code>chmod</code> changes permissions, <code>chown user:group file</code> changes owner.</p>",tip:"r=4, w=2, x=1. Add pannina number thaan permission. 7 = ellam, 5 = padikalaam + run pannalaam, 4 = padikka mattum.",code:"chmod 755 deploy.sh\nchmod +x deploy.sh\nchown ubuntu:ubuntu /opt/app -R"},
 {t:"Processes and services",b:"<p><code>ps aux</code> lists processes, <code>top</code>/<code>htop</code> shows live CPU and memory. <code>kill PID</code> asks nicely (SIGTERM), <code>kill -9 PID</code> forces (SIGKILL).</p><p>Services are managed by <b>systemd</b>: <code>systemctl start|stop|restart|status|enable nginx</code>. Their logs: <code>journalctl -u nginx</code>.</p>",tip:"enable = boot aagumbothu automatic ah start aagum. start = ippo mattum start aagum. Interview la idha confuse pannaadha.",code:"sudo systemctl restart nginx\nsudo systemctl enable nginx\njournalctl -u nginx --since '10 min ago'"},
 {t:"Text power tools",b:"<p>Logs are text, so these are your weapons: <code>grep</code> (search), <code>tail -f</code> (follow live), <code>less</code> (scroll), <code>awk</code> (columns), <code>sed</code> (replace), <code>|</code> (pipe output to next command), <code>&gt;</code> overwrite, <code>&gt;&gt;</code> append.</p>",tip:"Pipe | na oru command output ah next command ku pass panradhu. Factory assembly line maathiri.",code:"grep -i error app.log | tail -20\ncat access.log | awk '{print $1}' | sort | uniq -c | sort -nr | head"},
 {t:"Disk, memory, ports",b:"<p><code>df -h</code> disk space, <code>du -sh *</code> folder sizes, <code>free -m</code> memory, <code>uptime</code> load average, <code>ss -tulpn</code> or <code>lsof -i :8080</code> to see who is using a port.</p>",tip:"Server slow ah iruntha order: top (CPU) → free -m (RAM) → df -h (disk) → logs. Indha order interview la sonna impress aaguvaanga."}
],
mission:[
 {k:"mcq",q:"Where do system-wide configuration files live?",o:["/etc","/var","/home","/bin"],a:0,e:"/etc holds configuration, like /etc/nginx/nginx.conf or /etc/ssh/sshd_config."},
 {k:"cmd",q:"List ALL files (including hidden ones) in long format in the current folder.",a:[/^ls (-la|-al|-a -l|-l -a|-la \.|-al \.|-lA|-Al)$/],ans:"ls -la",e:"-l gives long format (permissions, owner, size), -a includes hidden dotfiles like .env."},
 {k:"mcq",q:"A file has permission 754. What can 'others' do?",o:["Read only","Read and execute","Read, write, execute","Nothing"],a:0,e:"7 = owner rwx, 5 = group r-x, 4 = others r-- (read only)."},
 {k:"cmd",q:"Make deploy.sh executable.",a:[/^chmod (\+x|u\+x|a\+x|ug\+x|755|775|700|744) (\.\/)?deploy\.sh$/],ans:"chmod +x deploy.sh",e:"chmod +x adds execute permission. Then run it with ./deploy.sh"},
 {k:"mcq",q:"Incident: the app crashes with 'No space left on device'. What do you run first?",o:["df -h","free -m","top","reboot"],a:0,e:"df -h shows disk usage per filesystem. Then du -sh /var/log/* to find what is eating space. Rebooting fixes nothing."},
 {k:"cmd",q:"Follow the nginx error log live: /var/log/nginx/error.log",a:[/^tail (-f|-F|--follow) \/var\/log\/nginx\/error\.log$/],ans:"tail -f /var/log/nginx/error.log",e:"tail -f keeps the file open and prints new lines as they arrive. Ctrl+C to exit."},
 {k:"ord",q:"Put these in order to install nginx and keep it running after reboots (Ubuntu).",o:["sudo apt update","sudo apt install nginx -y","sudo systemctl start nginx","sudo systemctl enable nginx","curl localhost"],e:"Refresh package list, install, start now, enable at boot, then verify."},
 {k:"mcq",q:"What does kill -9 send?",o:["SIGKILL: force stop, cannot be caught","SIGTERM: polite stop","SIGHUP: reload config","SIGINT: same as Ctrl+C"],a:0,e:"-9 is SIGKILL. The process gets no chance to clean up, so try plain kill (SIGTERM) first."},
 {k:"cmd",q:"Find every line containing ERROR in app.log.",a:[/^grep (-\w+ )?(["']?)ERROR\2 app\.log$/,/^cat app\.log \| grep (-\w+ )?(["']?)ERROR\2$/],ans:"grep ERROR app.log",e:"grep searches text. Add -i for case-insensitive, -n for line numbers, -c to count."}
],
interview:[
 {q:"Difference between a hard link and a soft (symbolic) link?",a:"<ul><li><b>Hard link</b>: another name pointing to the same inode (same data). Deleting the original keeps the data. Cannot cross filesystems or link directories.</li><li><b>Soft link</b>: a shortcut that stores a path. Breaks if the target is deleted. Can cross filesystems. Created with <code>ln -s target link</code>.</li></ul>"},
 {q:"How do you find which process is using port 8080?",a:"<code>sudo ss -tulpn | grep 8080</code> or <code>sudo lsof -i :8080</code> (older: <code>netstat -tulpn</code>). It shows the PID and program name. Then decide: stop the service properly or <code>kill PID</code>."},
 {q:"What is load average?",a:"The average number of processes running or waiting for CPU (and uninterruptible I/O) over 1, 5 and 15 minutes. Compare with CPU cores: load 4 on a 4-core box is fully busy; load 8 on 4 cores means things are queueing."},
 {q:"A Linux server is slow. Walk me through how you troubleshoot.",a:"<ul><li><code>uptime</code> / <code>top</code>: CPU and load, which process is hot</li><li><code>free -m</code>: memory, swap usage</li><li><code>df -h</code> and <code>iostat</code>: disk full or I/O wait</li><li><code>ss -s</code>: connection counts</li><li>Logs: <code>journalctl</code>, <code>/var/log</code>, app logs</li><li>Then check recent changes (deploys, cron jobs)</li></ul>"},
 {q:"What is an inode?",a:"A data structure that stores a file's metadata: permissions, owner, size, timestamps and pointers to data blocks. Not the filename. A disk can run out of inodes (lots of tiny files) even with free space. Check with <code>df -i</code>."}
]},

{id:"net",name:"Networking Wires",lvl:"Basics",blurb:"IPs, ports, DNS, HTTP. Half of all outages are 'it's the network'.",
concepts:[
 {t:"Layers: OSI and TCP/IP",b:"<p>OSI has 7 layers; remember the useful ones: <b>L3 Network</b> (IP, routing), <b>L4 Transport</b> (TCP/UDP, ports), <b>L7 Application</b> (HTTP, DNS). Load balancers are described this way too: L4 balancer sees IP+port, L7 sees URLs and headers.</p>",tip:"Courier maathiri: IP address = veetu address (L3), port = door number (L4), letter ulla content = HTTP (L7)."},
 {t:"TCP vs UDP",b:"<p><b>TCP</b>: connection-based, 3-way handshake (SYN, SYN-ACK, ACK), guaranteed ordered delivery. Used for HTTP, SSH, databases.</p><p><b>UDP</b>: no connection, no guarantee, very fast. Used for DNS queries, video calls, gaming.</p>",tip:"TCP = registered post (confirm pannuvaanga). UDP = notice throw panradhu, vandhucha illaiya check panna maattaanga."},
 {t:"IP addresses and CIDR",b:"<p><code>10.0.0.0/16</code> means the first 16 bits are fixed, so 2^(32-16) = 65,536 addresses. <code>/24</code> = 256 addresses. Private ranges: <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>.</p><p>In AWS, every subnet loses 5 IPs to AWS reservations, so a /24 gives 251 usable.</p>",tip:"/ number periya aana network chinna aagum. /16 = periya colony, /24 = oru street.",code:"/32 = 1 IP\n/28 = 16 IPs (smallest AWS subnet)\n/24 = 256 IPs\n/16 = 65,536 IPs"},
 {t:"DNS",b:"<p>DNS turns names into IPs. Flow: browser cache → OS cache → resolver → root → .com TLD → authoritative server. Records: <b>A</b> (name→IPv4), <b>AAAA</b> (IPv6), <b>CNAME</b> (name→name), <b>MX</b> (mail), <b>TXT</b> (verification), <b>NS</b> (who is authoritative). TTL controls caching.</p>",tip:"DNS = phone contacts. Name type pannaa number (IP) edukkum.",code:"dig example.com\nnslookup example.com\ndig +short CNAME www.example.com"},
 {t:"HTTP, ports, status codes",b:"<p>Ports to memorize: 22 SSH, 80 HTTP, 443 HTTPS, 53 DNS, 3306 MySQL, 5432 Postgres, 6379 Redis, 27017 MongoDB.</p><p>Status codes: 2xx ok, 3xx redirect, 4xx client mistake (401 not logged in, 403 not allowed, 404 not found), 5xx server problem (500 crash, 502 bad gateway, 503 unavailable, 504 gateway timeout).</p>",tip:"4xx = un thappu (client). 5xx = en thappu (server). 502/504 vandha load balancer ku pinnaadi irukura app ah check pannu."}
],
mission:[
 {k:"mcq",q:"How many IP addresses are in a /24 block?",o:["256","24","1024","65,536"],a:0,e:"32 - 24 = 8 host bits, 2^8 = 256."},
 {k:"mcq",q:"Which port does SSH use by default?",o:["22","21","80","3389"],a:0,e:"SSH = 22. (21 is FTP, 3389 is Windows RDP.)"},
 {k:"mcq",q:"Users see '502 Bad Gateway' from your load balancer. What does it usually mean?",o:["The LB got an invalid or no response from the backend app","The user typed a wrong URL","The user is not logged in","DNS is not configured"],a:0,e:"502 means the proxy/LB is fine, but the upstream (your app) crashed, refused or returned garbage. Check app health and logs."},
 {k:"mcq",q:"Which DNS record points one name to another name?",o:["CNAME","A","MX","NS"],a:0,e:"CNAME aliases a name to another name, e.g. www.shop.com → shop.netlify.app."},
 {k:"cmd",q:"Check what IP example.com resolves to.",a:[/^(dig|nslookup|host) example\.com$/,/^dig \+short example\.com$/],ans:"dig example.com",e:"dig gives full DNS detail; nslookup and host also work."},
 {k:"mcq",q:"Which protocol does a typical DNS query use?",o:["UDP port 53","TCP port 443","TCP port 22","UDP port 80"],a:0,e:"DNS queries use UDP 53 (TCP 53 is used for large responses and zone transfers)."},
 {k:"ord",q:"You type shop.com into a browser. Order what happens.",o:["DNS lookup finds the IP","TCP 3-way handshake","TLS handshake (HTTPS)","Browser sends HTTP GET request","Server responds, browser renders the page"],e:"Name → connection → encryption → request → response. This is a classic interview question."},
 {k:"cmd",q:"Test if port 443 is reachable on api.example.com.",a:[/^nc (-zv|-vz|-z -v|-v -z) api\.example\.com 443$/,/^telnet api\.example\.com 443$/,/^curl (-v|-I|-vI|-Iv) https:\/\/api\.example\.com\/?$/],ans:"nc -zv api.example.com 443",e:"nc -zv just tests the TCP connection. telnet and curl -v work too."},
 {k:"mcq",q:"How many addresses does 10.0.0.0/16 give?",o:["65,536","256","4,096","16"],a:0,e:"32 - 16 = 16 bits, 2^16 = 65,536. A common VPC size."}
],
interview:[
 {q:"What happens when you type a URL in the browser and press Enter?",a:"<ul><li>Browser checks caches, then DNS resolution gets the IP</li><li>TCP 3-way handshake with the server (port 443)</li><li>TLS handshake: certificate check, keys exchanged</li><li>HTTP request sent; it may pass a CDN, load balancer, reverse proxy</li><li>App server processes, maybe hits DB/cache, returns response</li><li>Browser parses HTML, loads CSS/JS/images, renders</li></ul>"},
 {q:"TCP vs UDP, with examples?",a:"TCP is connection-oriented, reliable, ordered, with flow control: HTTP, SSH, databases. UDP is connectionless and faster with no delivery guarantee: DNS, VoIP, video streaming, gaming. Choose TCP when correctness matters, UDP when speed matters more than a lost packet."},
 {q:"Explain the TCP 3-way handshake.",a:"Client sends <b>SYN</b> (with sequence number), server replies <b>SYN-ACK</b>, client sends <b>ACK</b>. Connection established. Closing uses FIN/ACK in both directions."},
 {q:"Difference between 401 and 403?",a:"<b>401 Unauthorized</b>: you are not authenticated (no or invalid credentials). <b>403 Forbidden</b>: you are authenticated but don't have permission for this resource."},
 {q:"What is the difference between a forward proxy and a reverse proxy?",a:"A <b>forward proxy</b> sits in front of clients and talks to the internet for them (corporate proxy). A <b>reverse proxy</b> sits in front of servers and receives traffic for them: load balancing, SSL termination, caching (nginx, ALB, Cloudflare)."}
]},

{id:"git",name:"Git Vault",lvl:"Basics",blurb:"Branches, merges, undo buttons. Every pipeline starts with a commit.",
concepts:[
 {t:"Three areas",b:"<p><b>Working directory</b> (your edits) → <code>git add</code> → <b>staging area</b> → <code>git commit</code> → <b>local repo</b> → <code>git push</code> → <b>remote</b> (GitHub).</p>",tip:"add = bag la pack panradhu, commit = bag ah lock panradhu, push = courier la anuppradhu.",code:"git add .\ngit commit -m \"Add login page\"\ngit push origin main"},
 {t:"Branches",b:"<p>A branch is just a pointer to a commit. Create and switch: <code>git checkout -b feature/x</code> or <code>git switch -c feature/x</code>. Teams work on feature branches and open a Pull Request to main.</p>"},
 {t:"Merge vs rebase",b:"<p><b>Merge</b> joins branches with a merge commit, history stays true. <b>Rebase</b> replays your commits on top of another branch, history becomes linear. Golden rule: never rebase a branch others already pulled.</p>",tip:"Merge = rendu road join aagura junction. Rebase = un road ah eduthu main road mudivula pudhusa podradhu."},
 {t:"Undo buttons",b:"<p><code>git revert &lt;sha&gt;</code>: new commit that undoes an old one. Safe for shared branches.</p><p><code>git reset --soft</code> (keep changes staged), <code>--mixed</code> (keep changes unstaged), <code>--hard</code> (throw changes away). Only on local, unpushed work.</p><p><code>git stash</code> parks uncommitted work temporarily.</p>"},
 {t:"fetch vs pull",b:"<p><code>git fetch</code> downloads remote changes without touching your files. <code>git pull</code> = fetch + merge (or rebase with <code>--rebase</code>).</p>"}
],
mission:[
 {k:"cmd",q:"Create a new branch feature/login and switch to it in one command.",a:[/^git (checkout -b|switch -c) feature\/login$/],ans:"git checkout -b feature/login",e:"Both checkout -b and switch -c create and switch."},
 {k:"mcq",q:"A bad commit is already pushed to shared main. Safest way to undo it?",o:["git revert <sha>","git reset --hard HEAD~1 then force push","Delete the repo","git stash"],a:0,e:"revert adds a new commit that undoes the change, without rewriting history others depend on."},
 {k:"ord",q:"Order the basic contribution flow.",o:["git clone <repo>","git checkout -b feature/x","Edit files","git add .","git commit -m \"message\"","git push origin feature/x"],e:"Clone, branch, change, stage, commit, push, then open a PR."},
 {k:"mcq",q:"What does git pull do?",o:["fetch + merge","Only downloads, no merge","Uploads your commits","Deletes local changes"],a:0,e:"pull = fetch + merge into your current branch."},
 {k:"cmd",q:"Show commit history, one line per commit.",a:[/^git log --oneline( --graph)?( --all)?( --decorate)?$/],ans:"git log --oneline",e:"Add --graph --all to see branches visually."},
 {k:"mcq",q:"When does a merge conflict happen?",o:["Both branches changed the same lines of the same file","You have too many branches","The remote is offline","You forgot git add"],a:0,e:"Git can't decide which change wins, so it marks the file with <<<<<<< ======= >>>>>>> and asks you."},
 {k:"cmd",q:"You need to switch branches but have half-done changes. Park them temporarily.",a:[/^git stash( push| save)?( -u)?$/],ans:"git stash",e:"git stash saves changes; git stash pop brings them back."},
 {k:"mcq",q:"What is the golden rule of rebasing?",o:["Don't rebase branches others are already using","Always rebase main onto feature","Rebase only on Fridays","Rebase deletes history so never use it"],a:0,e:"Rebase rewrites commit IDs. If teammates have the old commits, their history breaks."}
],
interview:[
 {q:"Merge vs rebase: when do you use which?",a:"Merge keeps full history with a merge commit; good for integrating shared branches. Rebase rewrites your commits on top of the target for a clean linear history; good for updating your local feature branch before a PR. Never rebase public shared branches."},
 {q:"Explain git reset --soft, --mixed and --hard.",a:"All move HEAD to a commit. <b>--soft</b>: changes stay staged. <b>--mixed</b> (default): changes stay in working directory, unstaged. <b>--hard</b>: changes are discarded. Use only for local unpushed commits."},
 {q:"What is git cherry-pick?",a:"Applies the changes of one specific commit onto your current branch. Example: a hotfix committed on main needs to go to release/1.2 too: <code>git cherry-pick &lt;sha&gt;</code>."},
 {q:"Someone accidentally committed an AWS secret key to GitHub. What do you do?",a:"<ul><li><b>First</b>: revoke/rotate the key immediately in IAM. Assume it's compromised (bots scan GitHub within minutes).</li><li>Check CloudTrail for misuse</li><li>Remove it from history with git filter-repo or BFG, force push</li><li>Prevent repeats: pre-commit hooks (gitleaks), secret scanning, use Secrets Manager / OIDC roles</li></ul>"},
 {q:"Which branching strategy have you used?",a:"Common answers: <b>Trunk-based</b> (short-lived feature branches merged to main frequently, behind feature flags; fits CI/CD) or <b>GitFlow</b> (develop, feature, release, hotfix branches; fits scheduled releases). Explain why your team picked it."}
]},

{id:"docker",name:"Container Dock",lvl:"Core",blurb:"Images, containers, Dockerfiles, compose. Package once, run anywhere.",
concepts:[
 {t:"Containers vs VMs",b:"<p>A <b>VM</b> virtualizes hardware and runs a full guest OS. A <b>container</b> shares the host's kernel and isolates processes using <b>namespaces</b> (what you can see) and <b>cgroups</b> (how much CPU/RAM you can use). Containers start in seconds and are tiny.</p>",tip:"VM = thani veedu (own foundation). Container = apartment flat (building/kernel share, aana un flat un privacy)."},
 {t:"Image, container, registry",b:"<p><b>Image</b>: read-only template built in layers. <b>Container</b>: a running instance of an image. <b>Registry</b>: where images live (Docker Hub, AWS ECR).</p>",tip:"Image = recipe/class. Container = samaicha saapadu/object. Oru image la irundhu 100 containers run pannalaam.",code:"docker build -t myapp:1.0 .\ndocker run -d -p 8080:80 --name web myapp:1.0\ndocker push 123456789.dkr.ecr.ap-south-1.amazonaws.com/myapp:1.0"},
 {t:"Dockerfile",b:"<p>Each instruction makes a layer. Put rarely-changing steps first so the build cache works: copy <code>package.json</code> and install deps <i>before</i> copying source code.</p><p><code>CMD</code> = default command (easy to override). <code>ENTRYPOINT</code> = fixed executable, CMD becomes its arguments.</p>",code:"FROM node:20-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/node_modules ./node_modules\nUSER node\nCMD [\"node\", \"dist/server.js\"]"},
 {t:"Volumes and networks",b:"<p>Container filesystems are temporary. Use <b>volumes</b> for data that must survive (databases). Containers on the same user-defined network reach each other by name, e.g. <code>db:5432</code>.</p>"},
 {t:"Docker Compose",b:"<p>Define multi-container apps in <code>docker-compose.yml</code> and run with <code>docker compose up -d</code>. Great for local dev: app + db + redis together.</p>",code:"services:\n  web:\n    build: .\n    ports: [\"8080:3000\"]\n    depends_on: [db]\n  db:\n    image: postgres:16\n    volumes: [pgdata:/var/lib/postgresql/data]\nvolumes:\n  pgdata:"}
],
mission:[
 {k:"mcq",q:"Main reason containers are lighter than VMs?",o:["They share the host OS kernel","They use less disk because of compression","They don't use CPU","They run only on Linux laptops"],a:0,e:"No guest OS per container. Isolation comes from kernel namespaces and cgroups."},
 {k:"cmd",q:"Run nginx in the background, mapping host port 8080 to container port 80.",a:[/^docker run(?=.* (-d|--detach)\b)(?=.* (-p|--publish) 8080:80\b).* nginx(:\S+)?$/],ans:"docker run -d -p 8080:80 nginx",e:"-d = detached, -p host:container. Then open http://localhost:8080"},
 {k:"cmd",q:"List running containers.",a:[/^docker (ps|container ls)$/],ans:"docker ps",e:"docker ps -a also shows stopped containers."},
 {k:"ord",q:"Order a cache-friendly Node.js Dockerfile.",o:["FROM node:20-alpine","WORKDIR /app","COPY package*.json ./","RUN npm ci","COPY . .","CMD [\"node\",\"server.js\"]"],e:"Dependencies are installed before copying source, so code changes don't re-run npm ci."},
 {k:"mcq",q:"Your Postgres container is deleted and recreated. How do you keep the data?",o:["Mount a volume for /var/lib/postgresql/data","Use a bigger image","Use CMD instead of ENTRYPOINT","Use docker commit every hour"],a:0,e:"Volumes live outside the container lifecycle."},
 {k:"cmd",q:"Follow the logs of a container named api.",a:[/^docker (logs (-f|--follow) api|logs api (-f|--follow))$/],ans:"docker logs -f api",e:"First command when a container misbehaves."},
 {k:"mcq",q:"Your image is 1.2 GB. Best way to shrink it?",o:["Multi-stage build with a slim/alpine/distroless base","Add more RUN lines","Use ADD instead of COPY","Use docker save"],a:0,e:"Build tools stay in the build stage; the final image gets only the runtime and app."},
 {k:"cmd",q:"Open a shell inside the running container web.",a:[/^docker exec -it web (sh|bash|\/bin\/sh|\/bin\/bash)$/],ans:"docker exec -it web sh",e:"-it = interactive terminal. Alpine images have sh, not bash."},
 {k:"mcq",q:"A container starts and exits immediately. Most likely cause?",o:["The main process finished or crashed (PID 1 exited)","The port is wrong","The image is too small","Docker needs a reboot"],a:0,e:"A container lives only as long as its main process. Check docker logs and docker ps -a for the exit code."}
],
interview:[
 {q:"Container vs virtual machine?",a:"VMs run a full guest OS on a hypervisor; heavier, slower to boot, stronger isolation. Containers share the host kernel, isolated via namespaces and cgroups; lightweight, start in seconds, high density. Often used together: containers running on VMs (EC2)."},
 {q:"COPY vs ADD? CMD vs ENTRYPOINT?",a:"COPY just copies local files. ADD also extracts tar files and can fetch URLs; prefer COPY for clarity. CMD sets the default command, easily overridden by <code>docker run image othercmd</code>. ENTRYPOINT fixes the executable; CMD then supplies default arguments."},
 {q:"How do you reduce Docker image size?",a:"<ul><li>Multi-stage builds</li><li>Slim, alpine or distroless base images</li><li>.dockerignore (exclude node_modules, .git)</li><li>Combine RUN steps and clean package caches</li><li>Install only production dependencies</li></ul>"},
 {q:"How do containers achieve isolation?",a:"Linux kernel features: <b>namespaces</b> (PID, network, mount, UTS, IPC, user) give each container its own view of the system; <b>cgroups</b> limit CPU, memory, I/O. Plus capabilities, seccomp and AppArmor/SELinux for security."},
 {q:"Docker best practices for security?",a:"Run as non-root (USER), minimal base images, scan images (Trivy, ECR scanning), no secrets in images or ENV baked at build, pin image versions, read-only filesystem where possible, keep images updated."}
]},

{id:"k8s",name:"Kubernetes Harbor",lvl:"Advanced",blurb:"Pods, deployments, services, probes. The most asked topic in DevOps interviews.",
concepts:[
 {t:"Architecture",b:"<p><b>Control plane</b>: <code>kube-apiserver</code> (front door, everything talks to it), <code>etcd</code> (key-value store with all cluster state), <code>kube-scheduler</code> (picks a node for each pod), <code>controller-manager</code> (keeps desired = actual).</p><p><b>Worker nodes</b>: <code>kubelet</code> (runs pods on the node), <code>kube-proxy</code> (service networking), container runtime (containerd).</p>",tip:"Control plane = office manager. etcd = office register book. Scheduler = yaaruku endha work nu assign panravan. kubelet = site la velai paakura supervisor."},
 {t:"Pod → ReplicaSet → Deployment",b:"<p>A <b>Pod</b> is the smallest unit: one or more containers sharing network and storage. A <b>ReplicaSet</b> keeps N pods running. A <b>Deployment</b> manages ReplicaSets and gives you rolling updates and rollbacks. Also: <b>StatefulSet</b> (stable names and storage, for databases), <b>DaemonSet</b> (one pod per node, for log/monitoring agents), <b>Job/CronJob</b>.</p>",code:"apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web}\nspec:\n  replicas: 3\n  selector: {matchLabels: {app: web}}\n  template:\n    metadata: {labels: {app: web}}\n    spec:\n      containers:\n      - name: web\n        image: myrepo/web:1.4\n        ports: [{containerPort: 8080}]\n        resources:\n          requests: {cpu: 100m, memory: 128Mi}\n          limits: {memory: 256Mi}"},
 {t:"Services and Ingress",b:"<p>Pods die and get new IPs, so a <b>Service</b> gives a stable address, finding pods by <b>label selectors</b>. Types: <b>ClusterIP</b> (internal only, default), <b>NodePort</b> (port on every node), <b>LoadBalancer</b> (cloud LB). <b>Ingress</b> routes HTTP by host/path to services through one entry point.</p>"},
 {t:"Config, probes, scaling",b:"<p><b>ConfigMap</b> for config, <b>Secret</b> for sensitive values (base64, not encrypted by default). <b>Liveness probe</b> fails → container restarted. <b>Readiness probe</b> fails → pod removed from Service traffic. <b>HPA</b> scales pods based on CPU/memory/custom metrics.</p>",tip:"Liveness = uyiroda irukaanaa? (illana restart). Readiness = velai seiya ready aa? (illana traffic anuppaadha)."},
 {t:"Troubleshooting states",b:"<p><b>CrashLoopBackOff</b>: app keeps crashing → <code>kubectl logs pod --previous</code>. <b>ImagePullBackOff</b>: wrong image name/tag or no registry access. <b>Pending</b>: no node has enough resources or a selector doesn't match. <b>OOMKilled</b>: exceeded memory limit.</p>",code:"kubectl get pods -A\nkubectl describe pod web-7d9f\nkubectl logs web-7d9f --previous\nkubectl get events --sort-by=.lastTimestamp"}
],
mission:[
 {k:"mcq",q:"Where is the entire cluster state stored?",o:["etcd","kubelet","kube-proxy","The container registry"],a:0,e:"etcd is the source of truth. Back it up!"},
 {k:"cmd",q:"List pods across ALL namespaces.",a:[/^kubectl get (pods|pod|po) (-A|--all-namespaces)$/],ans:"kubectl get pods -A",e:"-A is short for --all-namespaces."},
 {k:"mcq",q:"A pod is in CrashLoopBackOff. What do you check first?",o:["kubectl logs <pod> --previous and kubectl describe pod","Delete the cluster","Increase replicas","Restart the laptop"],a:0,e:"--previous shows logs of the crashed container; describe shows events and exit codes."},
 {k:"cmd",q:"Scale deployment web to 5 replicas.",a:[/^kubectl scale (deployment|deploy|deployments)(\/| )web --replicas[= ]5$/,/^kubectl scale --replicas[= ]5 (deployment|deploy)(\/| )web$/],ans:"kubectl scale deployment web --replicas=5",e:"For automatic scaling use an HPA instead."},
 {k:"mcq",q:"Which Service type exposes an app only inside the cluster?",o:["ClusterIP","NodePort","LoadBalancer","ExternalName"],a:0,e:"ClusterIP is the default and internal-only."},
 {k:"mcq",q:"A pod stays Pending for 10 minutes. Most likely reason?",o:["No node has enough CPU/memory for its requests","The app has a bug","The image tag is wrong","The liveness probe failed"],a:0,e:"Pending = not scheduled. describe pod shows 'Insufficient cpu' or a nodeSelector/taint mismatch. (Wrong image gives ImagePullBackOff.)"},
 {k:"cmd",q:"Apply the manifest deploy.yaml.",a:[/^kubectl apply -f (\.\/)?deploy\.yaml$/],ans:"kubectl apply -f deploy.yaml",e:"apply is declarative: creates or updates to match the file."},
 {k:"mcq",q:"Readiness probe fails on a pod. What happens?",o:["Pod is removed from Service endpoints, no restart","Container is restarted","Node is drained","Deployment is deleted"],a:0,e:"Readiness controls traffic. Liveness controls restarts."},
 {k:"cmd",q:"A bad release went out. Roll back deployment web to the previous version.",a:[/^kubectl rollout undo (deployment|deploy)(\/| )web$/],ans:"kubectl rollout undo deployment/web",e:"kubectl rollout history deployment/web lists revisions."},
 {k:"ord",q:"Order what happens after kubectl apply -f deploy.yaml.",o:["kubectl sends the request to the API server","API server validates and stores it in etcd","Deployment controller creates a ReplicaSet and pods","Scheduler assigns each pod to a node","kubelet on that node starts the containers"],e:"Everything flows through the API server; controllers and scheduler watch it; kubelet does the actual work."}
],
interview:[
 {q:"Explain Kubernetes architecture.",a:"Control plane: API server (entry point), etcd (state store), scheduler (places pods), controller manager (reconciliation loops). Worker nodes: kubelet (runs pods), kube-proxy (service rules), container runtime. Everything is declarative: you submit desired state, controllers keep reconciling actual state to match."},
 {q:"Deployment vs StatefulSet vs DaemonSet?",a:"<b>Deployment</b>: stateless apps, interchangeable pods, rolling updates. <b>StatefulSet</b>: stable pod names (db-0, db-1), ordered startup, per-pod persistent volumes; for databases, Kafka. <b>DaemonSet</b>: one pod on every node; for log collectors, monitoring agents, CNI."},
 {q:"How does a Service know which pods to send traffic to?",a:"Through <b>label selectors</b>. The Service selects pods with matching labels; Kubernetes keeps an EndpointSlice of ready pod IPs; kube-proxy (iptables/IPVS) routes the Service IP to those endpoints. Only pods passing readiness are included."},
 {q:"What are requests and limits? What is OOMKilled?",a:"<b>Requests</b>: guaranteed resources, used by the scheduler to place pods. <b>Limits</b>: maximum allowed. Exceeding CPU limit → throttled. Exceeding memory limit → container is killed: <b>OOMKilled</b> (exit code 137). Fix by raising the limit or fixing the memory leak."},
 {q:"How do you achieve zero-downtime deployments in Kubernetes?",a:"Rolling update strategy with maxSurge / maxUnavailable, proper readiness probes so new pods get traffic only when ready, graceful shutdown (preStop hook, terminationGracePeriodSeconds), PodDisruptionBudgets, and enough replicas. For more safety: canary or blue-green with Argo Rollouts or a service mesh."}
]},

{id:"cicd",name:"Pipeline Works",lvl:"Core",blurb:"CI/CD, GitHub Actions, Jenkins, deployment strategies.",
concepts:[
 {t:"CI vs CD vs CD",b:"<p><b>Continuous Integration</b>: every push is built and tested automatically. <b>Continuous Delivery</b>: every change is releasable; production deploy needs a manual approval. <b>Continuous Deployment</b>: passes tests → goes to prod automatically.</p>",tip:"Delivery = button press panna prod pogum. Deployment = button kooda venaam, automatic ah pogum."},
 {t:"Typical pipeline",b:"<p>Checkout → build → unit tests → code quality and security scan (SonarQube, SAST) → build Docker image → scan image (Trivy) → push to registry (ECR) → deploy to staging → integration tests → approval → deploy to prod → smoke test.</p>"},
 {t:"GitHub Actions",b:"<p>Workflows live in <code>.github/workflows/*.yml</code>. Key parts: <code>on</code> (trigger), <code>jobs</code>, <code>runs-on</code>, <code>steps</code>, <code>uses</code> (reusable actions), <code>secrets</code>.</p>",code:"name: ci\non:\n  push:\n    branches: [main]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    permissions: {id-token: write, contents: read}\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm test\n      - uses: aws-actions/configure-aws-credentials@v4\n        with:\n          role-to-assume: arn:aws:iam::123456789012:role/gh-deploy\n          aws-region: ap-south-1\n      - run: docker build -t app:${{ github.sha }} ."},
 {t:"Jenkins",b:"<p>Self-hosted automation server. Pipelines are written as code in a <code>Jenkinsfile</code> in the repo (declarative: <code>pipeline { agent, stages { stage { steps } } }</code>). Controller schedules jobs, agents run them. Plugins for everything.</p>"},
 {t:"Deployment strategies",b:"<p><b>Rolling</b>: replace instances a few at a time. <b>Blue-green</b>: two identical environments, switch traffic at once, instant rollback by switching back. <b>Canary</b>: send 5-10% of traffic to the new version, watch metrics, then increase. <b>Feature flags</b>: deploy code dark, turn on later.</p>",tip:"Canary = coal mine la paravai anuppi safe ah nu check pannuvaanga. Konja users ku mattum first release."}
],
mission:[
 {k:"mcq",q:"Continuous Delivery vs Continuous Deployment: the key difference?",o:["Delivery needs a manual approval before prod; Deployment is fully automatic","Delivery has no tests","Deployment only works with Jenkins","They are the same"],a:0,e:"Both keep code always releasable. Deployment removes the human gate."},
 {k:"ord",q:"Order this pipeline.",o:["Checkout code","Build and run unit tests","Static code and security scan","Build Docker image","Push image to ECR","Deploy to staging","Approve and deploy to production"],e:"Fail fast: cheap checks first, deploys last."},
 {k:"mcq",q:"Which strategy keeps two full environments and switches all traffic at once?",o:["Blue-green","Canary","Rolling","Recreate"],a:0,e:"Blue = current, green = new. Flip the router; rollback = flip back."},
 {k:"mcq",q:"You want 5% of users on v2 first, watching error rates. Which strategy?",o:["Canary","Blue-green","Recreate","Big bang"],a:0,e:"Canary gradually shifts traffic based on metrics."},
 {k:"mcq",q:"In GitHub Actions, where do workflow files live?",o:[".github/workflows/","Jenkinsfile",".gitlab-ci.yml","/etc/actions"],a:0,e:"Any .yml file in .github/workflows/ is a workflow."},
 {k:"mcq",q:"Best way for a pipeline to get AWS access?",o:["OIDC federation to assume an IAM role (short-lived credentials)","Hardcode access keys in the YAML","Commit keys in a .env file","Use the root account keys"],a:0,e:"OIDC means no long-lived keys to leak. Second best: keys stored as encrypted secrets, rotated."},
 {k:"mcq",q:"Where should a Jenkinsfile live?",o:["In the application's repository (pipeline as code)","Only in the Jenkins UI","In /tmp on the agent","In a Word document"],a:0,e:"Versioned with the code, reviewed in PRs."},
 {k:"mcq",q:"Your pipeline takes 40 minutes. Which helps most?",o:["Cache dependencies and Docker layers, run tests in parallel","Add more manual approvals","Run it only once a week","Remove all tests"],a:0,e:"Caching and parallelism are the standard speed-ups."}
],
interview:[
 {q:"Explain a CI/CD pipeline you have built.",a:"Structure your answer: <b>trigger</b> (PR / push to main) → <b>build & test</b> → <b>quality & security</b> (SonarQube, Trivy) → <b>artifact</b> (Docker image tagged with git SHA, pushed to ECR) → <b>deploy</b> (Helm/ArgoCD to EKS, or ECS) to staging → approval → prod → <b>verify</b> (smoke tests, monitoring) and <b>rollback</b> plan. Mention tools and one problem you solved (e.g. cut build time from 25 to 8 minutes with caching)."},
 {q:"Blue-green vs canary?",a:"Blue-green: two full environments, instant switch and instant rollback, but double cost during release. Canary: gradual traffic shift with metric checks, limits blast radius, needs good monitoring and traffic splitting (ALB weighted target groups, service mesh, Argo Rollouts)."},
 {q:"How do you roll back a bad deployment?",a:"Depends on setup: redeploy the previous image tag (immutable tags make this easy), <code>kubectl rollout undo</code>, switch blue-green back, or turn off the feature flag. Database migrations must be backward compatible (expand/contract) so rollback is safe."},
 {q:"How do you manage secrets in CI/CD?",a:"Never in code. Use the CI's encrypted secrets, or better, pull at runtime from AWS Secrets Manager / SSM Parameter Store / Vault. Use OIDC roles instead of static cloud keys. Mask secrets in logs, least-privilege permissions per pipeline, rotate regularly."},
 {q:"What is GitOps?",a:"Git is the single source of truth for desired infrastructure/app state. A controller (ArgoCD, Flux) in the cluster pulls from Git and syncs automatically. Benefits: audit trail, easy rollback via git revert, drift detection, no cluster credentials in CI."}
]},

{id:"iac",name:"IaC Foundry",lvl:"Core",blurb:"Terraform and Ansible. Infrastructure written as code, reviewed like code.",
concepts:[
 {t:"Why Infrastructure as Code",b:"<p>Clicking in the console is not repeatable. IaC gives version control, code review, identical environments (dev = staging = prod) and fast disaster recovery.</p>",tip:"Console la click panradhu = kaila samaikiradhu. IaC = recipe ezhudhi vechikiradhu, yaar venaalum same taste la samaikalaam."},
 {t:"Terraform workflow",b:"<p><code>terraform init</code> (download providers, set up backend) → <code>fmt</code>/<code>validate</code> → <code>plan</code> (preview) → <code>apply</code> (create/change) → <code>destroy</code>. Written in HCL, declarative: you describe the end state.</p>",code:"resource \"aws_s3_bucket\" \"logs\" {\n  bucket = \"myco-app-logs-prod\"\n  tags = { env = \"prod\" }\n}\n\noutput \"bucket_arn\" {\n  value = aws_s3_bucket.logs.arn\n}"},
 {t:"State",b:"<p>Terraform records what it created in a <b>state file</b>. For teams, store it remotely (S3 backend) with <b>locking</b> so two people can't apply at once (S3 native lockfile in newer versions, or a DynamoDB table). State can contain secrets: encrypt it and restrict access.</p>",code:"terraform {\n  backend \"s3\" {\n    bucket       = \"myco-tf-state\"\n    key          = \"prod/network.tfstate\"\n    region       = \"ap-south-1\"\n    encrypt      = true\n    use_lockfile = true\n  }\n}"},
 {t:"Modules, variables, envs",b:"<p><b>Modules</b> are reusable packages (a VPC module used by dev and prod). <b>Variables</b> + <code>.tfvars</code> files per environment. <code>count</code> and <code>for_each</code> create multiple resources. <code>terraform import</code> brings existing resources under management.</p>"},
 {t:"Ansible",b:"<p>Configuration management: installs packages, edits configs, deploys apps on existing servers. <b>Agentless</b> (uses SSH), YAML <b>playbooks</b>, an <b>inventory</b> of hosts, <b>modules</b> like apt, copy, service. Tasks are <b>idempotent</b>.</p><p>Common split: Terraform builds the servers, Ansible configures them.</p>",code:"- hosts: web\n  become: true\n  tasks:\n    - name: Install nginx\n      apt: {name: nginx, state: present, update_cache: true}\n    - name: Start nginx\n      service: {name: nginx, state: started, enabled: true}"}
],
mission:[
 {k:"ord",q:"Order the Terraform workflow.",o:["terraform init","terraform validate","terraform plan","terraform apply"],e:"init once per folder/backend change, then validate, plan, apply."},
 {k:"cmd",q:"Preview what Terraform will change without changing anything.",a:[/^terraform plan( -out[= ]\S+)?( -var-file[= ]\S+)?$/],ans:"terraform plan",e:"Save it with -out=tfplan and apply exactly that plan in CI."},
 {k:"mcq",q:"Why use a remote backend like S3 with locking?",o:["Team shares one state and two applies can't run at once","It makes Terraform faster","It's required for plan to work","It removes the need for providers"],a:0,e:"Local state on one laptop breaks teamwork and gets lost."},
 {k:"mcq",q:"Someone changed a security group in the AWS console. What is this called and what shows it?",o:["Drift; terraform plan shows the difference","A merge conflict; git shows it","A race condition; apply hides it","Nothing, Terraform ignores it"],a:0,e:"Plan compares state + real infra to code. Fix by updating code or applying to revert."},
 {k:"mcq",q:"Typical split between Terraform and Ansible?",o:["Terraform provisions infrastructure; Ansible configures software on servers","Ansible creates VPCs; Terraform installs nginx","Both are only for Kubernetes","Terraform is only for Azure"],a:0,e:"They overlap, but this split is the common answer."},
 {k:"cmd",q:"Run playbook site.yml against inventory hosts.ini.",a:[/^ansible-playbook -i (\.\/)?hosts\.ini (\.\/)?site\.yml$/,/^ansible-playbook (\.\/)?site\.yml -i (\.\/)?hosts\.ini$/],ans:"ansible-playbook -i hosts.ini site.yml",e:"Add --check for a dry run."},
 {k:"mcq",q:"What does idempotent mean?",o:["Running it many times gives the same end result as running once","It runs in parallel","It never fails","It needs an agent"],a:0,e:"Ansible's apt state=present installs only if missing."},
 {k:"mcq",q:"Why must the Terraform state file be protected?",o:["It can contain secrets like DB passwords in plain text","It contains your Git history","It is very large","It stores your laptop password"],a:0,e:"Encrypt the bucket, block public access, restrict IAM, enable versioning."}
],
interview:[
 {q:"What is Terraform state and why is it important?",a:"State maps resources in code to real resources (IDs, attributes). Terraform uses it to compute plans and track dependencies. Keep it remote (S3), locked, encrypted and versioned. Never edit by hand; use <code>terraform state mv/rm</code> and <code>import</code>."},
 {q:"count vs for_each?",a:"<b>count</b> creates N copies indexed 0..N-1; removing one from the middle shifts indexes and can recreate resources. <b>for_each</b> uses a map/set keyed by stable names, so adding/removing one item doesn't disturb others. Prefer for_each for named things."},
 {q:"How do you manage dev, staging and prod with Terraform?",a:"Shared modules plus separate root folders or separate state files per environment, each with its own .tfvars. Workspaces are an option for near-identical envs. Separate AWS accounts per environment is best practice. CI runs plan on PR and apply after merge."},
 {q:"How do you bring manually created resources into Terraform?",a:"Write the resource block, then <code>terraform import</code> (or an <code>import</code> block in code, Terraform 1.5+), then run plan until it shows no changes."},
 {q:"Terraform vs Ansible?",a:"Terraform: declarative, provisioning cloud resources, keeps state, great for immutable infra. Ansible: procedural-ish YAML tasks, agentless over SSH, configures OS and apps, no state file. They complement each other."}
]},

{id:"iam",name:"AWS Gate: IAM & EC2",lvl:"Core",blurb:"Regions, IAM, EC2, pricing. Your first steps inside AWS.",
concepts:[
 {t:"Global infrastructure",b:"<p><b>Region</b>: a geographic area (ap-south-1 = Mumbai). <b>Availability Zone</b>: one or more isolated data centers within a region (ap-south-1a, 1b, 1c). Spread across AZs for high availability. <b>Edge locations</b>: CDN points for CloudFront.</p>",tip:"Region = city (Mumbai). AZ = adhula thani thani area la irukura data centers. Oru AZ la current pona kooda innoru AZ la app odum."},
 {t:"IAM",b:"<p><b>Users</b> (people), <b>groups</b> (sets of users), <b>roles</b> (temporary identities assumed by services or people), <b>policies</b> (JSON permissions). Evaluation: default deny, explicit allow grants, <b>explicit deny always wins</b>. Lock the root account with MFA, never use it daily.</p>",code:"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Action\": [\"s3:GetObject\"],\n    \"Resource\": \"arn:aws:s3:::my-app-assets/*\"\n  }]\n}"},
 {t:"EC2 basics",b:"<p>Virtual servers. Pick an <b>AMI</b> (OS image), an <b>instance type</b> (t = burstable, m = general, c = compute, r = memory), a <b>key pair</b> for SSH, a <b>security group</b> (firewall) and optional <b>user data</b> (script run at first boot).</p>",code:"#!/bin/bash\n# user data\ndnf install -y nginx\nsystemctl enable --now nginx"},
 {t:"Pricing models",b:"<p><b>On-Demand</b>: pay per second, no commitment. <b>Savings Plans / Reserved</b>: commit 1 or 3 years, up to ~72% off. <b>Spot</b>: spare capacity up to ~90% off, can be taken back with 2 minutes notice. Good for batch and stateless workers.</p>",tip:"On-demand = auto meter. Reserved = monthly pass. Spot = last minute discount ticket, aana eppo venaalum irakki viduvaanga."},
 {t:"Security groups and storage",b:"<p><b>Security group</b>: stateful firewall at instance level, allow rules only. If inbound 443 is allowed, the reply traffic is allowed automatically.</p><p><b>EBS</b>: network disk attached to one instance (in one AZ), survives stop. <b>Instance store</b>: fast local disk, lost on stop.</p>"}
],
mission:[
 {k:"mcq",q:"An app on EC2 needs to read from S3. Best way to give access?",o:["Attach an IAM role (instance profile) to the instance","Put access keys in the code","Use the root user's keys","Make the bucket public"],a:0,e:"Roles give auto-rotated temporary credentials. No keys to leak."},
 {k:"mcq",q:"What is an Availability Zone?",o:["One or more isolated data centers inside a region","A country","A CDN cache","A VPC"],a:0,e:"Regions contain multiple AZs connected by low-latency links."},
 {k:"mcq",q:"Cheapest option for a fault-tolerant batch job that can be interrupted?",o:["Spot Instances","On-Demand","Dedicated Hosts","Reserved for 3 years"],a:0,e:"Spot is up to ~90% off; batch can retry if interrupted."},
 {k:"cmd",q:"Using the AWS CLI, list your S3 buckets.",a:[/^aws s3 ls$/,/^aws s3api list-buckets$/],ans:"aws s3 ls",e:"aws s3 ls s3://bucket-name lists objects inside one."},
 {k:"cmd",q:"Check which IAM identity your CLI is currently using.",a:[/^aws sts get-caller-identity$/],ans:"aws sts get-caller-identity",e:"First command when debugging 'AccessDenied': am I even who I think I am?"},
 {k:"mcq",q:"A policy allows s3:* but another attached policy explicitly denies s3:DeleteObject. Result?",o:["DeleteObject is denied","DeleteObject is allowed","Error, policies conflict","The newest policy wins"],a:0,e:"Explicit deny always wins."},
 {k:"mcq",q:"SSH to your EC2 instance times out. What do you check first?",o:["Security group inbound rule for port 22 from your IP","The AMI version","S3 bucket policy","CloudFront settings"],a:0,e:"Timeout = network blocked (SG, NACL, no public IP, no route to IGW). 'Permission denied' would be a key/user problem."},
 {k:"cmd",q:"SSH into 1.2.3.4 as ec2-user using key mykey.pem.",a:[/^ssh -i (\.\/)?mykey\.pem ec2-user@1\.2\.3\.4$/],ans:"ssh -i mykey.pem ec2-user@1.2.3.4",e:"Run chmod 400 mykey.pem first or SSH refuses the key. Ubuntu AMIs use user 'ubuntu'. Modern alternative: SSM Session Manager, no port 22 at all."},
 {k:"mcq",q:"When does EC2 user data run by default?",o:["Once, at the first boot","On every SSH login","Every hour","Only when you stop the instance"],a:0,e:"Used for bootstrapping: install packages, pull config."}
],
interview:[
 {q:"IAM user vs IAM role?",a:"A <b>user</b> has long-term credentials (password, access keys) tied to one identity. A <b>role</b> has no permanent credentials; it is assumed and gives temporary credentials via STS. Use roles for EC2, Lambda, cross-account access, CI/CD (OIDC) and SSO."},
 {q:"What is the principle of least privilege? How do you apply it?",a:"Grant only the permissions needed for the task, nothing more. Start from zero, add specific actions and resources, use conditions, review with IAM Access Analyzer and last-accessed data, use permission boundaries and SCPs in AWS Organizations."},
 {q:"How do you secure the AWS root account?",a:"MFA on root, delete root access keys, don't use it for daily work, strong password stored safely, alerts on root login (CloudTrail + EventBridge), use AWS Organizations with SSO for humans."},
 {q:"Explain EC2 pricing models.",a:"On-Demand (flexible, highest price), Savings Plans/Reserved Instances (1-3 year commitment, large discount, for steady workloads), Spot (up to 90% off, interruptible, for batch/stateless/CI runners), Dedicated Hosts (compliance/licensing)."},
 {q:"You can't SSH into an EC2 instance. Troubleshoot.",a:"<ul><li><b>Timeout</b>: security group port 22 from your IP, NACL, instance has public IP, subnet route 0.0.0.0/0 → IGW, instance running and passing status checks</li><li><b>Permission denied</b>: right key, right username (ec2-user / ubuntu), key file chmod 400</li><li>Use EC2 Instance Connect or SSM Session Manager as alternate access</li></ul>"}
]},

{id:"vpc",name:"AWS Network City: VPC",lvl:"Advanced",blurb:"Subnets, gateways, load balancers, Route 53. Architect-level questions live here.",
concepts:[
 {t:"VPC and subnets",b:"<p>A <b>VPC</b> is your private network in a region (e.g. 10.0.0.0/16). Split it into <b>subnets</b>, each in one AZ. A subnet is <b>public</b> only if its route table sends 0.0.0.0/0 to an <b>Internet Gateway</b>. Otherwise it's private.</p>",tip:"VPC = un gated community. Public subnet = main road pakkathula irukura veedu. Private subnet = ulla irukura veedu, direct ah road illa."},
 {t:"IGW vs NAT Gateway",b:"<p><b>Internet Gateway</b>: two-way internet for public subnets. <b>NAT Gateway</b>: lives in a public subnet and lets private instances go <i>out</i> to the internet (updates, APIs) while nothing can come <i>in</i>. NAT Gateway costs money per hour and per GB.</p>"},
 {t:"Security Group vs NACL",b:"<p><b>Security group</b>: instance level, stateful, allow rules only. <b>NACL</b>: subnet level, stateless (allow return traffic explicitly), allow and deny rules, evaluated in number order.</p>",tip:"SG = flat door security (unna nyaabagam vechukuvaan). NACL = colony gate security (ulla pogum podhum veliya varum podhum check pannuvaan)."},
 {t:"Load balancers",b:"<p><b>ALB</b> (Layer 7): HTTP/HTTPS, path and host routing (/api → service A), WebSockets. <b>NLB</b> (Layer 4): TCP/UDP, extreme performance, static IPs. Both send traffic to <b>target groups</b> and run health checks.</p>"},
 {t:"Route 53 and connectivity",b:"<p><b>Route 53</b>: DNS with routing policies (simple, weighted, latency, failover, geolocation) and health checks. <b>VPC peering</b>: connect two VPCs (non-transitive). <b>Transit Gateway</b>: hub connecting many VPCs and on-prem. <b>VPC endpoints</b>: reach S3/DynamoDB and other AWS services privately without internet.</p>",code:"Internet\n   │\n Route 53 → ALB (public subnets, AZ-a + AZ-b)\n               │\n         App EC2/ECS (private subnets)\n               │\n         RDS Multi-AZ (private DB subnets)\n Private → NAT GW (public) → Internet for updates"}
],
mission:[
 {k:"mcq",q:"What makes a subnet 'public'?",o:["Its route table has 0.0.0.0/0 → Internet Gateway","It has 'public' in its name","It is in AZ-a","It has a NAT Gateway inside"],a:0,e:"It's all about the route table."},
 {k:"mcq",q:"Private EC2 instances need to download OS updates, but must not be reachable from the internet. Use:",o:["NAT Gateway in a public subnet","Internet Gateway attached to the private subnet","Elastic IP on each instance","VPC peering"],a:0,e:"NAT allows outbound only. Route private subnet 0.0.0.0/0 → NAT GW."},
 {k:"mcq",q:"Security groups are:",o:["Stateful, allow rules only","Stateless, allow and deny","Stateful, deny rules only","Applied at subnet level"],a:0,e:"That's NACL that is stateless with deny rules."},
 {k:"mcq",q:"You must block one malicious IP from reaching your subnet. Use:",o:["A NACL deny rule","A security group deny rule","An IAM policy","Route 53"],a:0,e:"Security groups cannot deny. (For web apps, AWS WAF is also an option.)"},
 {k:"mcq",q:"Route /api/* to one service and /images/* to another. Which load balancer?",o:["Application Load Balancer","Network Load Balancer","Classic Load Balancer","Gateway Load Balancer"],a:0,e:"Path-based routing is Layer 7 = ALB."},
 {k:"mcq",q:"How many IPs does AWS reserve in every subnet?",o:["5","2","0","10"],a:0,e:"Network address, VPC router, DNS, future use, broadcast."},
 {k:"mcq",q:"Private instances need S3 access without going through the internet or NAT. Use:",o:["S3 Gateway VPC endpoint","An Internet Gateway","A bigger NAT Gateway","CloudFront"],a:0,e:"Gateway endpoints for S3/DynamoDB are free and save NAT data charges."},
 {k:"ord",q:"Order the path of a user request to an app in a private subnet.",o:["Route 53 resolves the domain","Request hits the ALB in public subnets","ALB forwards to a healthy target in the target group","App instance in the private subnet handles it","App queries RDS in the DB subnet"],e:"Only the ALB is public; app and DB stay private."},
 {k:"mcq",q:"Send users to the AWS region with the lowest latency for them. Route 53 policy?",o:["Latency-based routing","Simple routing","Weighted routing","Multivalue"],a:0,e:"Geolocation routes by user location; latency routes by measured latency."}
],
interview:[
 {q:"Design a VPC for a 3-tier web application.",a:"VPC 10.0.0.0/16 across 2-3 AZs. Per AZ: public subnet (ALB, NAT GW), private app subnet (EC2/ECS/EKS), private DB subnet (RDS). Public route → IGW; private routes → NAT GW (one per AZ for HA). Security groups chained: ALB SG allows 443 from internet; app SG allows only from ALB SG; DB SG allows 5432 only from app SG. VPC endpoints for S3, flow logs for audit."},
 {q:"Security group vs NACL?",a:"SG: instance/ENI level, stateful, allow-only, all rules evaluated. NACL: subnet level, stateless (need rules for return traffic, ephemeral ports 1024-65535), allow and deny, rules evaluated in number order, first match wins."},
 {q:"Internet Gateway vs NAT Gateway?",a:"IGW gives public subnets two-way internet access for resources with public IPs. NAT Gateway sits in a public subnet and gives private subnets outbound-only internet. NAT is a managed, paid, AZ-scoped service."},
 {q:"ALB vs NLB?",a:"ALB: Layer 7, HTTP/HTTPS, host/path/header routing, WAF integration, Lambda targets. NLB: Layer 4, TCP/UDP/TLS, millions of requests per second, ultra-low latency, static/Elastic IPs, preserves client IP."},
 {q:"VPC peering vs Transit Gateway?",a:"Peering: one-to-one, non-transitive (A-B and B-C doesn't give A-C), no extra hourly cost, gets messy at scale (mesh). Transit Gateway: hub-and-spoke connecting many VPCs, VPNs and Direct Connect, central route tables, costs per attachment and GB."}
]},

{id:"data",name:"AWS Storage & DB Vault",lvl:"Core",blurb:"S3, EBS, EFS, RDS, DynamoDB, CloudFront.",
concepts:[
 {t:"S3",b:"<p>Object storage: <b>buckets</b> hold <b>objects</b> (files up to 5 TB). 11 nines durability. Storage classes: <b>Standard</b>, <b>Intelligent-Tiering</b>, <b>Standard-IA</b> (infrequent access), <b>Glacier</b> (archive). <b>Versioning</b> protects against deletes, <b>lifecycle rules</b> move or expire objects, <b>Block Public Access</b> stays on by default.</p>",tip:"S3 = unlimited Google Drive maathiri, aana folder illa, ellam key name thaan (images/2024/a.png).",code:"aws s3 cp backup.tar.gz s3://my-backups/\naws s3 sync ./site s3://my-site --delete\naws s3 presign s3://my-backups/report.pdf --expires-in 3600"},
 {t:"EBS vs EFS vs S3",b:"<p><b>EBS</b>: block disk for one EC2 instance in one AZ (like a hard drive). <b>EFS</b>: shared NFS filesystem mounted by many Linux instances across AZs. <b>S3</b>: object storage via API, not mountable as a normal disk.</p>"},
 {t:"RDS and Aurora",b:"<p>Managed relational DBs (MySQL, Postgres...). AWS handles patching and backups. <b>Multi-AZ</b>: synchronous standby in another AZ, automatic failover, for <b>high availability</b>. <b>Read replicas</b>: asynchronous copies for <b>scaling reads</b>. Aurora is AWS's cloud-native version with faster storage.</p>",tip:"Multi-AZ = backup goalkeeper (match la vilayaada maattaar, main goalkeeper adi pattaa ulla varuvaar). Read replica = extra players for reading load."},
 {t:"DynamoDB and caching",b:"<p><b>DynamoDB</b>: serverless NoSQL key-value, single-digit ms at any scale, design around <b>partition key</b> access patterns. <b>ElastiCache</b> (Redis/Memcached) caches hot data in memory. <b>CloudFront</b> CDN caches content at edge locations close to users.</p>"}
],
mission:[
 {k:"mcq",q:"Ten Linux EC2 instances across AZs need the same shared folder. Use:",o:["EFS","EBS","Instance store","Glacier"],a:0,e:"EBS attaches to one instance (multi-attach is limited, same AZ). EFS is shared NFS."},
 {k:"mcq",q:"Main purpose of RDS Multi-AZ?",o:["High availability with automatic failover","Scaling read traffic","Cheaper storage","Cross-region analytics"],a:0,e:"The standby doesn't serve reads (classic Multi-AZ). For reads use read replicas."},
 {k:"mcq",q:"Your DB CPU is high from read-heavy reporting queries. Best fix?",o:["Add read replicas or a cache like ElastiCache","Enable Multi-AZ","Move to S3","Use a bigger EBS volume"],a:0,e:"Offload reads to replicas, hot data to cache."},
 {k:"cmd",q:"Upload backup.tar.gz to the bucket my-backups.",a:[/^aws s3 cp (\.\/)?backup\.tar\.gz s3:\/\/my-backups\/?(backup\.tar\.gz)?$/],ans:"aws s3 cp backup.tar.gz s3://my-backups/",e:"Use aws s3 sync for whole folders."},
 {k:"cmd",q:"Sync the local folder ./site to bucket my-site.",a:[/^aws s3 sync (\.\/)?site\/? s3:\/\/my-site\/?( --delete)?$/],ans:"aws s3 sync ./site s3://my-site",e:"--delete removes files from S3 that no longer exist locally."},
 {k:"mcq",q:"Automatically move logs to Glacier after 90 days and delete after 1 year. Use:",o:["S3 lifecycle rules","A cron job on EC2","S3 versioning","CloudFront"],a:0,e:"Lifecycle rules handle transitions and expiry with no code."},
 {k:"mcq",q:"A developer deleted an important S3 object. What would let you recover it?",o:["Versioning was enabled on the bucket","Block Public Access","Server-side encryption","Bucket tags"],a:0,e:"With versioning, a delete just adds a delete marker; older versions remain."},
 {k:"mcq",q:"Serve a static React site fast to users worldwide. Best combo?",o:["S3 + CloudFront","EC2 in one region","RDS + EBS","DynamoDB"],a:0,e:"Use Origin Access Control so the bucket stays private and only CloudFront reads it."}
],
interview:[
 {q:"Explain S3 storage classes and when to use them.",a:"Standard: frequently accessed. Intelligent-Tiering: unknown/changing access patterns, auto-moves. Standard-IA / One Zone-IA: infrequent but quick access (backups). Glacier Instant/Flexible/Deep Archive: archives, cheaper but retrieval time and cost grow. Use lifecycle rules to move data automatically."},
 {q:"EBS vs EFS vs S3?",a:"EBS: block storage, one instance, one AZ, low latency, for boot/DB disks. EFS: managed NFS file system, shared by many instances across AZs, elastic size. S3: object storage via HTTP API, unlimited, cheapest, for backups, media, data lakes, static sites."},
 {q:"RDS Multi-AZ vs read replica?",a:"Multi-AZ: synchronous replication to a standby in another AZ, automatic failover, for availability, same endpoint. Read replica: asynchronous, readable, separate endpoint, can be cross-region, for read scaling; can be promoted manually for DR."},
 {q:"When would you choose DynamoDB over RDS?",a:"DynamoDB: known access patterns by key, massive scale, serverless, single-digit ms latency (sessions, carts, IoT, leaderboards). RDS: complex joins, ad-hoc queries, strong relational constraints, transactions across many tables, existing SQL apps."},
 {q:"How do you secure an S3 bucket?",a:"Block Public Access on, bucket policies with least privilege, encryption (SSE-S3 or SSE-KMS), enforce TLS (aws:SecureTransport), versioning + MFA delete for critical data, access logging/CloudTrail data events, VPC endpoints with endpoint policies, CloudFront OAC instead of public buckets."}
]},

{id:"scale",name:"AWS Scale & Serverless Lab",lvl:"Advanced",blurb:"Auto Scaling, Lambda, SQS/SNS, CloudWatch, ECS/EKS.",
concepts:[
 {t:"Auto Scaling Groups",b:"<p>An ASG keeps between <b>min</b> and <b>max</b> instances, aiming for <b>desired</b>. It uses a <b>launch template</b>, replaces unhealthy instances, and scales with policies: <b>target tracking</b> (keep CPU at 50%), step scaling, scheduled scaling. Put it behind an ALB.</p>",tip:"Kadai la rush adhigam aana extra billing counter open pannuvaanga, rush kammi aana close pannuvaanga. Adhu thaan auto scaling."},
 {t:"Lambda",b:"<p>Run code without servers, triggered by events (API Gateway, S3 upload, SQS, schedule). Pay per request and duration. Max timeout <b>15 minutes</b>. <b>Cold start</b>: first invocation after idle is slower. Mitigate with provisioned concurrency or smaller packages.</p>"},
 {t:"SQS, SNS, EventBridge",b:"<p><b>SQS</b>: queue, one consumer group pulls messages; decouples services and absorbs spikes. Standard (at-least-once, best-effort order) or FIFO (exactly-once processing, ordered). <b>SNS</b>: pub/sub push to many subscribers (fan-out). <b>EventBridge</b>: event bus with rules routing events.</p>",tip:"SQS = token system queue (one by one process). SNS = WhatsApp group announcement (ellarukum orey neram pogum)."},
 {t:"CloudWatch and CloudTrail",b:"<p><b>CloudWatch</b>: metrics, logs, alarms, dashboards. Answers 'how is my system performing?' <b>CloudTrail</b>: records every API call. Answers 'who did what, when?'</p>"},
 {t:"Containers on AWS",b:"<p><b>ECR</b>: image registry. <b>ECS</b>: AWS's simpler container orchestrator. <b>EKS</b>: managed Kubernetes. <b>Fargate</b>: serverless compute for ECS/EKS, no EC2 nodes to manage.</p>"}
],
mission:[
 {k:"mcq",q:"Maximum execution time for one Lambda invocation?",o:["15 minutes","5 minutes","1 hour","Unlimited"],a:0,e:"Longer jobs: Step Functions, ECS/Fargate tasks or Batch."},
 {k:"mcq",q:"The order service slows down because it waits on a slow email service. Fix?",o:["Put messages in an SQS queue; email workers consume asynchronously","Make the order service bigger","Call the email service twice","Use Route 53"],a:0,e:"Decoupling with a queue: orders return fast, emails retry independently."},
 {k:"mcq",q:"One 'order placed' event must reach billing, shipping and analytics. Use:",o:["SNS topic fanning out to SQS queues (or EventBridge)","One SQS queue shared by all three","CloudTrail","An S3 bucket"],a:0,e:"With one shared queue each message goes to only one consumer."},
 {k:"mcq",q:"Production EC2 instance was terminated. How do you find out who did it?",o:["CloudTrail","CloudWatch metrics","Trusted Advisor","VPC flow logs"],a:0,e:"CloudTrail logs the TerminateInstances call with the identity, time and source IP."},
 {k:"mcq",q:"Keep average CPU of an ASG around 60% automatically. Which policy?",o:["Target tracking scaling","Scheduled scaling","Manual scaling","Simple scaling with no alarms"],a:0,e:"Target tracking works like a thermostat."},
 {k:"mcq",q:"Run containers on ECS without managing any EC2 instances. Use:",o:["Fargate","Spot Fleet","Elastic Beanstalk on EC2","Lightsail"],a:0,e:"Fargate = serverless containers."},
 {k:"mcq",q:"Email the team when CPU > 80% for 5 minutes. Setup?",o:["CloudWatch alarm → SNS topic → email subscription","CloudTrail → S3","Lambda polling every second","IAM policy"],a:0,e:"Classic alerting chain."},
 {k:"cmd",q:"Invoke the Lambda function hello from the CLI, writing the response to out.json.",a:[/^aws lambda invoke --function-name hello (\.\/)?out\.json$/],ans:"aws lambda invoke --function-name hello out.json",e:"The outfile argument is required."}
],
interview:[
 {q:"What is a Lambda cold start and how do you reduce it?",a:"When no warm execution environment exists, AWS must create one: download code, start runtime, run init code. Adds latency (100ms to seconds). Reduce with: provisioned concurrency, smaller packages, lighter runtimes, moving init outside the handler carefully, SnapStart for Java."},
 {q:"SQS Standard vs FIFO?",a:"Standard: nearly unlimited throughput, at-least-once delivery, best-effort ordering, so consumers must be idempotent. FIFO: strict ordering within a message group, exactly-once processing, lower throughput limits. Also know visibility timeout and dead-letter queues."},
 {q:"CloudWatch vs CloudTrail?",a:"CloudWatch = performance and operations (metrics, logs, alarms). CloudTrail = audit (who made which API call, from where, when). Both feed security monitoring."},
 {q:"ECS vs EKS?",a:"ECS: AWS-native, simpler, deep AWS integration, no control plane fee. EKS: managed Kubernetes, portable, huge ecosystem (Helm, ArgoCD, operators), more complexity, control plane fee. Both run on EC2 or Fargate."},
 {q:"How does an ASG handle an unhealthy instance?",a:"With EC2 status checks (default) or ELB health checks (recommended behind a load balancer), the ASG marks it unhealthy, terminates it and launches a replacement from the launch template, keeping desired capacity. Lifecycle hooks allow draining or custom actions."}
]},

{id:"sre",name:"SRE Watchtower",lvl:"Advanced",blurb:"Monitoring, SLOs, incidents, DevSecOps. How senior engineers think.",
concepts:[
