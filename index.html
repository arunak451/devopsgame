 {t:"Observability: metrics, logs, traces",b:"<p><b>Metrics</b>: numbers over time (CPU, request rate). <b>Logs</b>: detailed events. <b>Traces</b>: one request's journey across services. Tools: Prometheus + Grafana, ELK/OpenSearch or Loki, OpenTelemetry + Jaeger/X-Ray, Datadog.</p>",tip:"Metrics = BP machine reading. Logs = doctor diary. Traces = patient hospital la endha endha room ponaaru nu track panradhu."},
 {t:"Prometheus and Grafana",b:"<p>Prometheus <b>pulls</b> (scrapes) metrics from <code>/metrics</code> endpoints and exporters (node_exporter), stores time series, queried with <b>PromQL</b>. <b>Alertmanager</b> routes alerts. Grafana visualizes.</p>",code:"# 5xx error rate per service, last 5 minutes\nsum(rate(http_requests_total{status=~\"5..\"}[5m])) by (service)\n/\nsum(rate(http_requests_total[5m])) by (service)"},
 {t:"SLI, SLO, SLA, error budget",b:"<p><b>SLI</b>: a measurement (99.95% of requests succeeded). <b>SLO</b>: internal target (99.9% monthly). <b>SLA</b>: contract with customers, with penalties. <b>Error budget</b> = 100% - SLO. 99.9% allows about 43 minutes of downtime per 30 days. Budget spent → slow releases, fix reliability.</p>"},
 {t:"Golden signals",b:"<p>Google SRE's four: <b>Latency</b>, <b>Traffic</b>, <b>Errors</b>, <b>Saturation</b>. Alert on symptoms users feel, not on every CPU spike.</p>"},
 {t:"Incidents and DevSecOps",b:"<p>Incident flow: detect → triage → <b>mitigate first</b> (rollback, failover) → find root cause → <b>blameless postmortem</b> with action items. Track MTTD and MTTR.</p><p>DevSecOps: security built into the pipeline: SAST, dependency scanning, image scanning (Trivy), secrets scanning (gitleaks), IaC scanning (Checkov, tfsec).</p>",tip:"Veedu theepidichaa first theeya anaikanum, appuram thaan yaar match potaangannu kandupidikanum. Mitigate first, RCA later."}
],
mission:[
 {k:"mcq",q:"An SLO of 99.9% availability per 30 days allows roughly how much downtime?",o:["43 minutes","4 minutes","8 hours","1 day"],a:0,e:"30 × 24 × 60 × 0.001 = 43.2 minutes. 99.99% is about 4.3 minutes."},
 {k:"mcq",q:"How does Prometheus collect metrics?",o:["Pulls (scrapes) from targets' /metrics endpoints","Agents push to it by email","Reads CloudTrail","From Git commits"],a:0,e:"Pull model. For short-lived jobs there's the Pushgateway."},
 {k:"mcq",q:"Which is NOT one of the four golden signals?",o:["Disk brand","Latency","Errors","Saturation"],a:0,e:"Latency, Traffic, Errors, Saturation."},
 {k:"mcq",q:"SLA vs SLO?",o:["SLA is an external contract with consequences; SLO is an internal target","They are identical","SLO is legal, SLA is internal","SLA is a metric, SLO is a log"],a:0,e:"SLOs are usually stricter than SLAs to leave a safety margin."},
 {k:"mcq",q:"Production is down after a deploy. Your first priority?",o:["Mitigate: roll back or fail over to restore service","Find the root cause in the code","Write the postmortem","Blame the developer"],a:0,e:"Restore service first. Investigation comes after."},
 {k:"mcq",q:"Which tool scans container images for known vulnerabilities?",o:["Trivy","Grafana","Ansible","Route 53"],a:0,e:"Also Grype, Snyk, ECR image scanning (Inspector)."},
 {k:"ord",q:"Order the incident lifecycle.",o:["Alert fires / incident detected","Triage severity and assign an incident commander","Mitigate impact (rollback, failover)","Identify and fix the root cause","Blameless postmortem with action items"],e:"Communicate status throughout."},
 {k:"mcq",q:"The team has used its entire error budget for the month. What should happen?",o:["Pause risky feature releases and focus on reliability work","Ship features faster","Delete the SLO","Raise the SLO to 100%"],a:0,e:"Error budgets balance speed and reliability."}
],
interview:[
 {q:"Explain SLI, SLO and SLA with an example.",a:"SLI: % of HTTP requests returning non-5xx in under 300ms. SLO: that SLI ≥ 99.9% over 30 days. SLA: we promise customers 99.5%, else service credits. Error budget 0.1% guides release decisions."},
 {q:"How would you set up monitoring for a new microservice?",a:"Instrument with OpenTelemetry/Prometheus client: RED metrics (rate, errors, duration) + saturation. Structured JSON logs shipped centrally with request IDs. Distributed tracing. Grafana dashboard. SLO-based alerts on user-facing symptoms routed via Alertmanager/PagerDuty, with runbooks linked in each alert."},
 {q:"Tell me about an incident you handled.",a:"Use <b>STAR</b>: <b>Situation</b> (checkout API 5xx spiked to 20% after release), <b>Task</b> (on-call, restore service), <b>Action</b> (checked dashboards, correlated with deploy, rolled back in 6 minutes, found missing DB index in new query), <b>Result</b> (MTTR 12 min, added canary analysis + query review to pipeline). Mention communication and the blameless postmortem."},
 {q:"Metrics vs logs vs traces: when do you use each?",a:"Metrics: cheap, aggregated, for alerting and trends ('error rate is up'). Logs: detailed context for debugging specific events ('which error, which user'). Traces: find which service/span in a request chain is slow or failing. Correlate them via trace IDs."},
 {q:"What is DevSecOps?",a:"Shifting security left: automated security checks in every stage. Code: SAST, secret scanning. Dependencies: SCA. Build: image scanning, signing (cosign). IaC: Checkov/tfsec. Runtime: least-privilege IAM, network policies, runtime detection (GuardDuty, Falco). Security is shared responsibility, not a final gate."}
]},

{id:"boss",name:"Final Boss: The Interview",lvl:"Boss",blurb:"Scenario rounds, system design, behavioral. Clear this and you're ready.",
concepts:[
 {t:"The design answer framework",b:"<p>For any 'design X on AWS' question, walk through: <b>1. Requirements</b> (users, traffic, availability, budget) → <b>2. Architecture</b> (draw it: DNS, LB, compute, DB, storage) → <b>3. Scaling</b> (ASG/HPA, caching, read replicas) → <b>4. Security</b> (IAM, private subnets, encryption, WAF) → <b>5. Reliability</b> (Multi-AZ, backups, DR) → <b>6. Observability</b> → <b>7. CI/CD</b> → <b>8. Cost</b>.</p>",tip:"Interviewer ku answer mattum illa, un thinking process thaan mukkiyam. Kelvi kettu requirements clear panni apram design pannu."},
 {t:"STAR for behavioral questions",b:"<p><b>S</b>ituation, <b>T</b>ask, <b>A</b>ction, <b>R</b>esult. Keep it 1-2 minutes, focus on what <i>you</i> did, end with a number (time saved, cost cut, MTTR reduced).</p>"},
 {t:"Build a portfolio project",b:"<p>One end-to-end project beats ten certificates: a small app → Dockerfile → GitHub Actions (test, scan, build, push to ECR) → Terraform (VPC, EKS or ECS, RDS) → Helm/ArgoCD deploy → Prometheus + Grafana dashboards + alerts → README with architecture diagram. Talk about problems you hit.</p>",code:"repo/\n├── app/            # code + Dockerfile\n├── infra/          # terraform modules (vpc, eks, rds)\n├── k8s/            # helm chart\n├── .github/workflows/ci.yml\n└── README.md       # diagram + how to run"},
 {t:"Disaster recovery vocabulary",b:"<p><b>RPO</b>: how much data you can lose (time). <b>RTO</b>: how long recovery can take. Strategies from cheap/slow to expensive/fast: <b>Backup & restore</b> → <b>Pilot light</b> → <b>Warm standby</b> → <b>Multi-site active-active</b>.</p>"}
],
mission:[
 {k:"mcq",q:"During a sale, 2 fixed EC2 instances hit 95% CPU and the site crawls. Best long-term fix?",o:["Put instances in an Auto Scaling Group behind an ALB","Restart the instances every hour","Ask users to come back later","Increase EBS size"],a:0,e:"Horizontal scaling + load balancing, plus caching/CDN for static content."},
 {k:"mcq",q:"RDS hits 'too many connections' because hundreds of Lambdas connect directly. Fix?",o:["Use RDS Proxy for connection pooling","Enable S3 versioning","Switch to a smaller instance","Disable Multi-AZ"],a:0,e:"RDS Proxy pools and reuses connections."},
 {k:"mcq",q:"A canary release shows a 10% error rate while the old version shows 0.2%. Action?",o:["Halt the rollout and shift traffic back to the stable version","Promote the canary to 100%","Wait a day","Disable alerts"],a:0,e:"That's exactly what canaries are for."},
 {k:"mcq",q:"The AWS bill doubled this month. First step?",o:["Use Cost Explorer grouped by service/tags to find the spike","Delete random resources","Close the account","Buy Reserved Instances immediately"],a:0,e:"Common culprits: NAT Gateway data, idle instances, unattached EBS, forgotten dev environments. Then set AWS Budgets alerts."},
 {k:"mcq",q:"Which DR strategy has the lowest cost but the slowest recovery?",o:["Backup and restore","Multi-site active-active","Warm standby","Pilot light"],a:0,e:"Cheap to slow → expensive to fast: backup/restore, pilot light, warm standby, active-active."},
 {k:"ord",q:"Order your answer to 'Design a highly available web app on AWS'.",o:["Clarify requirements and traffic","Draw the core architecture","Explain scaling","Cover security","Cover reliability, backups and DR","Add monitoring and CI/CD","Discuss cost trade-offs"],e:"This structure shows senior-level thinking."},
 {k:"mcq",q:"What does STAR stand for?",o:["Situation, Task, Action, Result","Start, Test, Analyze, Release","Skill, Talent, Attitude, Role","Scope, Timeline, Assets, Risk"],a:0,e:"Use it for every behavioral question."},
 {k:"mcq",q:"Interviewer asks something you don't know. Best response?",o:["Say you haven't used it, then reason through how you'd approach or learn it","Make up a confident answer","Stay silent","Change the topic"],a:0,e:"Honesty plus problem-solving beats bluffing. Interviewers can tell."}
],
interview:[
 {q:"Design a highly available, scalable web application on AWS.",a:"Route 53 → CloudFront (static assets from S3, WAF) → ALB across 2-3 AZs → app tier in ASG or ECS/EKS in private subnets with auto scaling → ElastiCache for sessions/hot data → RDS/Aurora Multi-AZ with read replicas → S3 for uploads. Security: least-privilege IAM roles, SG chaining, KMS encryption, Secrets Manager. Reliability: backups, cross-region snapshots, health checks. Observability: CloudWatch/Prometheus, alarms. CI/CD with blue-green or canary. Cost: Savings Plans, Spot for workers, right-sizing."},
 {q:"Tell me about yourself (DevOps fresher / career switch).",a:"60-90 seconds: present (what you do now / studied) → DevOps journey (what you learned and <b>built</b>: 'I built an end-to-end pipeline deploying a containerized app to EKS with Terraform and GitHub Actions') → what excites you about this role → why this company. Avoid reading your resume line by line."},
 {q:"Walk me through your project end to end.",a:"Problem → architecture diagram (explain each box) → CI/CD flow → infra as code → monitoring → one hard problem and how you solved it → what you'd improve next. Be ready for deep follow-ups on every tool you mention."},
 {q:"Why DevOps?",a:"Connect to real motivation: you enjoy automating repetitive work, understanding the whole system from code to production, faster feedback, and reliability. Back it with an example of something you automated and the time it saved."},
 {q:"What would you do in your first 30 days?",a:"Learn the systems and architecture, read runbooks and postmortems, get access and shadow on-call, understand the pipelines and pain points, ship small improvements (docs, a flaky test, a dashboard), build relationships with dev teams."}
]}
];

const X={};
X.linux={
kid:[
"Un veetla ovvoru porulukkum oru fixed place irukku la? Dress almirah la, saapadu kitchen la. Linux um <b>appadi dhaan</b>. <code>/</code> (root) thaan main gate. Adhukulla rooms: <code>/etc</code> = settings room, <code>/var/log</code> = diary room (enna nadandhuchu nu ellam ezhudhi vechirukkum), <code>/home</code> = ovvoru user oda bedroom. <code>pwd</code> = 'naan ippo endha room la irukken?', <code>ls</code> = 'indha room la enna irukku?', <code>cd</code> = 'next room ku po'.",
"Un diary ku 3 types of people irukaanga: <b>nee</b> (owner), <b>un family</b> (group), <b>veliya irukura ellarum</b> (others). Ovvoruthar kum 3 permission: <b>r</b> = padikkalaam (4), <b>w</b> = ezhudhalaam (2), <b>x</b> = run pannalaam (1). Number ah add pannu: 4+2+1 = 7 (ellam), 4+1 = 5 (padichi run pannalaam), 4 = padikka mattum. So <code>755</code> = nee ellam pannalaam, family um others um padichi run mattum pannalaam.",
"<b>Process</b> = ippo odikittu irukura oru program. Kitchen la samaikkura amma maadhiri, velai nadandhutu irukku. <b>Service</b> = eppovumae background la odanum nu set panna process, like watchman. Night um day um nikkanum. <b>systemd</b> thaan watchmen ellaraiyum manage panra manager. <code>start</code> = ippo duty ku vaa, <code>enable</code> = daily morning automatic ah duty ku vaa (reboot aanaalum).",
"Logs na periya diary, lakhs of lines irukkum. Adhula oru error ah kandupidikka magnifying glass venum, adhu dhaan <code>grep</code>. <code>tail -f</code> = live TV maadhiri pudhu lines vara vara kaattum. <b>Pipe</b> <code>|</code> = oru machine oda output ah next machine ku kudukura conveyor belt. Example: 'diary ah open pannu → error lines mattum edu → kadaisi 20 kaattu'.",
"Server ah oru <b>school bag</b> nu nenachukko. <code>df -h</code> = bag la evlo space meedhi irukku (disk). <code>free -m</code> = un kai la evlo things hold panna mudiyum (RAM). <code>top</code> = yaaru romba velai vaangraanga (CPU). <b>Port</b> = building la door numbers. 80 = web door, 22 = SSH door. <code>ss -tulpn</code> = 'endha door la yaaru nikkuraanga?' nu paakradhu."
],
say:[
{s:"A hard link is another name for the same inode, so it points directly to the same data on disk. If I delete the original file, the data is still there through the hard link. A soft link, or symlink, just stores the path to the target, like a shortcut. If the target is deleted, the symlink breaks. Hard links can't cross filesystems or point to directories, symlinks can. In practice I use symlinks a lot, for example pointing /opt/app/current to the latest release folder so a rollback is just changing the link.",c:"Definition sonnadhum oru real use case sollu (current → release symlink). Adhu dhaan 'idhu use panni irukkaan' nu interviewer ku feel aagum."},
{s:"I'd run sudo ss -tulpn and grep for 8080, or sudo lsof -i :8080. That gives me the PID and the process name. Then I check what that process is. If it's a stale copy of our own app, I stop it properly with systemctl, and only use kill if it's not managed by systemd. I'd also check why it was still running, so it doesn't happen again.",c:"Command mattum sollaama 'apram enna pannuven' nu step sollu. Kill -9 first sonna red flag."},
{s:"Load average is the average number of processes that are running or waiting for CPU, and on Linux also those stuck in uninterruptible I/O, over the last 1, 5 and 15 minutes. I always compare it with the number of CPU cores. A load of 4 on a 4-core machine means it's fully busy, and 8 on 4 cores means work is queueing. If load is high but CPU usage is low, I suspect I/O wait and check disk with iostat.",c:"'Cores oda compare pannanum' ndra point thaan important. Adha sollalana answer half dhaan."},
{s:"I go from top to bottom. First uptime and top to see load and which process is using CPU. Then free -m for memory and swap. Then df -h for disk space and iostat for I/O wait. Then I look at logs with journalctl and the application logs. And very important, I check what changed recently, like a deployment or a cron job, because most issues come from a change. Once I find the cause, I fix it and then add monitoring or an alert so we catch it earlier next time.",c:"Idhu scenario question. Step by step 'first… then… then…' nu pesu. Kadaisi la 'prevent pannuven' sonna senior maadhiri theriyum."},
{s:"An inode is a data structure that stores a file's metadata: owner, permissions, size, timestamps and pointers to the data blocks. The filename itself is stored in the directory, not in the inode. A filesystem has a fixed number of inodes, so if an app creates millions of tiny files, you can get 'no space left on device' even when df -h shows free space. I check that with df -i.",c:"'df -h free ah irukku aana disk full error' ndra twist sonna, interviewer happy aaguvaanga."}
],
lab:{title:"Your own Linux box: files, permissions, nginx and logs",time:"45 min",cost:"Free (your laptop)",need:"Windows 10/11 with WSL, or any Ubuntu machine",
goal:"Ubuntu install panni, files create panni, permissions maathi, nginx web server run panni, adhoda logs ah grep panni paakradhu. Interview la 'I am comfortable on the Linux command line' nu confident ah solla idhu podhum.",
steps:[
{t:"Install Ubuntu with WSL",d:"PowerShell ah <b>Run as Administrator</b> la open pannu. Indha command Ubuntu ah un Windows kulla install pannum. Mudinjadhum restart pannu, username/password kekum.",c:`wsl --install -d Ubuntu`},
{t:"Walk around the filesystem",d:"Ovvoru command um type pannitu output ah padi. Edhu enna folder nu purinjikko.",c:`pwd
ls -la /
ls /etc | head
ls -la /var/log
cd ~ && pwd`},
{t:"Create files and folders",d:"Oru project folder create pannu, file ezhudhu, copy pannu, move pannu.",c:`mkdir -p ~/lab/app/logs
cd ~/lab/app
echo "hello devops" > notes.txt
echo "second line" >> notes.txt
cat notes.txt
cp notes.txt backup.txt && mv backup.txt logs/

{t:"Play with permissions",d:"Oru script ezhudhi, mudhalla run panna try pannu (Permission denied varum). Apram chmod pannitu run pannu. <code>ls -l</code> la rwx maaradhu paaru.",c:`printf '#!/bin/bash\\necho "Deploy started at $(date)"\\n' > deploy.sh
./deploy.sh          # Permission denied
ls -l deploy.sh      # -rw-r--r--
chmod 755 deploy.sh
ls -l deploy.sh      # -rwxr-xr-x
./deploy.sh`},
{t:"Install and run nginx as a service",d:"Real server la panra maadhiri web server install pannu. <code>status</code> la 'active (running)' varanum. (systemctl work aagalana, WSL la systemd off ah irukkum. Ubuntu terminal la <code>wsl --update</code> PowerShell la pannitu try pannu, illana AWS lab la EC2 la pannalaam.)",c:`sudo apt update

systemctl status nginx --no-pager
curl -I localhost`},
{t:"Read logs like an on-call engineer",d:"Oru terminal la live log follow pannu, innoru terminal la requests anuppu, illaadha page kooda kelu (404 varum).",c:`# terminal 1
sudo tail -f /var/log/nginx/access.log
# terminal 2
curl localhost
curl localhost/does-not-exist

"Oru letter anuppura maadhiri nenachukko. Nee letter ezhudhura (Application), cover la podra (Transport), address ezhudhura (Network), postman kondu poraar (Link/Physical). Receiver side la reverse la open aagum. <b>OSI = 7 steps</b>, <b>TCP/IP = 4 steps</b>, same idea. Interview la mostly L4 (TCP/UDP ports) and L7 (HTTP) dhaan kepaanga.",
"<b>TCP</b> = registered post. Receive aachaa nu confirm pannuvaanga, missing aana thirumba anuppuvaanga, order um correct ah irukkum. Konjam slow. <b>UDP</b> = paper boy. Paper ah veesitu poiduvaan, vizhundhucha nu paakka maataan. Romba fast. Video call, games, DNS ku UDP. Website, payments, SSH ku TCP.",
"<b>IP address</b> = un veetu address. <b>CIDR</b> <code>/24</code> = 'first 24 bits street name, meedhi house number'. /24 la 256 addresses, /16 la 65,536. Number chinna ah irundha network periyadhu. <b>Private IP</b> (10.x, 172.16-31.x, 192.168.x) = colony kulla mattum work aagura address, internet la theriyaadhu.",
"Phone la 'Amma' nu contact name paathu call panra, number nyabagam vechukka maatta. <b>DNS</b> = internet oda phonebook. <code>google.com</code> → <code>142.250.x.x</code> nu number ah maathi kudukkum. <b>A record</b> = name → IPv4, <b>CNAME</b> = name → innoru name, <b>TTL</b> = evlo neram indha answer ah nyabagam vechukkalaam.",
"<b>HTTP</b> = browser server kitta pesura language. 'GET' = kudu, 'POST' = idha vaangikko. <b>Status codes</b> = server oda reply mood: <b>2xx</b> = 'seri, idho', <b>3xx</b> = 'anga po', <b>4xx</b> = 'nee thappu panna' (404 page illa, 401 yaaru nee?, 403 unakku permission illa), <b>5xx</b> = 'en side la problem' (500 bug, 502/503/504 backend down/slow)."

say:[
{s:"First the browser checks its cache, then asks DNS to resolve the domain to an IP address. Then it opens a TCP connection with the three-way handshake, and since it's HTTPS, it does a TLS handshake to agree on encryption and verify the certificate. Then it sends an HTTP GET request. Usually that hits a load balancer or CDN first, which forwards it to a web server, which may call an app server and a database. The response comes back with a status code, the browser parses the HTML, downloads CSS, JS and images, and renders the page.",c:"Classic question. DNS → TCP → TLS → HTTP → LB → server → response → render nu order ah sollu. LB/CDN sonna DevOps angle varum."},
{s:"TCP is connection-oriented and reliable. It does a handshake, guarantees order, and retransmits lost packets, so it's used for HTTP, SSH and databases. UDP is connectionless, it just sends packets with no guarantee, which makes it faster with lower overhead. That's why it's used for DNS queries, video streaming, VoIP and online games, where speed matters more than a lost packet.",c:"Ovvoru one kum 2-3 examples sollu. Examples illaama sonna memorize panna maadhiri theriyum."},
{s:"The client sends a SYN with its starting sequence number. The server replies with SYN-ACK, acknowledging the client and sending its own sequence number. The client sends an ACK, and now the connection is established. Closing uses FIN and ACK from both sides. When I debug connection issues, for example in tcpdump, a SYN with no SYN-ACK usually means a firewall or security group is dropping the traffic.",c:"Last line (firewall/SG debug) dhaan unna mathavanga kitta irundhu separate pannum."},
{s:"401 Unauthorized means the server doesn't know who you are: you're not authenticated, like a missing or expired token. 403 Forbidden means the server knows who you are, but you're not allowed to access that resource. So 401 is 'log in first', 403 is 'logged in, but no permission'. In AWS, for example, an S3 AccessDenied is a 403 because the credentials are valid but the policy doesn't allow it.",c:"'401 = who are you?, 403 = I know you, but no' nu simple ah sollu."},
{s:"A forward proxy sits in front of clients and makes requests on their behalf, for example a company proxy that controls which websites employees can reach. The server sees the proxy, not the user. A reverse proxy sits in front of servers and receives requests on their behalf. Nginx, an AWS ALB or Cloudflare are examples. It's used for load balancing, SSL termination, caching and hiding the backend servers.",c:"'Forward = client side, reverse = server side' first line la sollidu. Apram nginx/ALB example."}
],

"Exam ku answer ezhudhura maadhiri nenachukko. <b>Working directory</b> = rough note la ezhudhitu irukka. <b>Staging area</b> (<code>git add</code>) = 'idhu final answer' nu select panna lines. <b>Repository</b> (<code>git commit</code>) = answer sheet la neat ah ezhudhi submit panniten, photo eduthu vechaachu. Endha photo ku venumnaalum thirumba pogalaam.",
"<b>Branch</b> = drawing book oda photocopy. Main drawing ah kedukkaama, copy la pudhu colour try pannalaam. Nalla irundha main la serthukkalaam (merge), nalla illana copy ah thooki podalaam. <code>main</code> = eppovum work aagura clean version.",
"Rendu per oru story ezhudhuraanga. <b>Merge</b> = rendu story ah join panni, 'inga serthom' nu oru knot (merge commit) podradhu. History la ellam theriyum. <b>Rebase</b> = un pages ah eduthu, avanga story oda kadaisi la pudhusa ezhudhina maadhiri thirumba ottradhu. Line straight ah irukkum. <b>Rule</b>: matha ellarum use panra branch ah rebase pannaadha.",
"<b>restore</b> = rough note la ezhudhinadha azhichidu. <b>reset</b> = 'last submit ah cancel pannu' (un sheet la mattum). <b>revert</b> = 'andha thappu answer ku opposite ah oru pudhu correction page add pannu', history azhiyaadhu. Shared branch la <b>revert</b> dhaan safe, reset illa.",
"<b>fetch</b> = friend kitta 'pudhu notes enna irukku?' nu kettu vaangi bag la vechukka, un notebook la innum copy pannala. <b>pull</b> = vaangi udane un notebook la copy pannidu (fetch + merge). fetch safe, paathutu decide pannalaam."

say:[
{s:"Both integrate changes from one branch into another. Merge keeps the full history and adds a merge commit, so it's safe and non-destructive. Rebase replays my commits on top of the target branch, which gives a clean, linear history but rewrites commit hashes. My rule is: I rebase my own local feature branch on main to keep it up to date before opening a PR, but I never rebase a branch that others are working on. For merging into main, we use merge or squash merge through pull requests.",c:"Rule ('shared branch ah rebase pannaadha') sonna dhaan nee real ah team la work panna maadhiri theriyum."},
{s:"All three move HEAD to an earlier commit. Soft keeps my changes staged, so it's useful for squashing the last few commits into one. Mixed, the default, keeps the changes in my working directory but unstages them. Hard throws away the changes completely. I only use reset on local commits that haven't been pushed. If something is already on a shared branch, I use git revert instead, which adds a new commit that undoes it without rewriting history.",c:"Kadaisi la 'pushed aana revert dhaan' nu sonna answer complete."},
{s:"Cherry-pick takes one specific commit from another branch and applies it on my current branch as a new commit. A typical use is a hotfix: the fix was merged to main, and I need the same fix on a release branch without bringing all the other changes from main. I run git cherry-pick with the commit hash and resolve conflicts if there are any.",c:"Hotfix example sollu. Example dhaan answer ku uyir."},
{s:"First I treat the key as compromised, because deleting the commit is not enough, bots scan GitHub within minutes. So step one is to deactivate and rotate the key in IAM immediately. Then I check CloudTrail for any activity with that key, like new instances or users. After that I remove it from the history with git filter-repo or BFG and force push, and ask the team to re-clone. Finally I prevent it from happening again: move secrets to Secrets Manager or GitHub secrets, add the file to .gitignore, and add secret scanning like gitleaks as a pre-commit hook and in CI.",c:"Order romba important: 1. rotate key 2. CloudTrail check 3. history clean 4. prevent. 'Commit ah delete pannuven' nu mattum sonna fail."},
{s:"I've used trunk-based development with short-lived feature branches. Developers branch off main, keep the branch small, open a pull request with CI checks and at least one review, and merge within a day or two. Main is always deployable, and we use tags for releases. I've also worked with GitFlow, which has develop, release and hotfix branches, but it's heavier, so it fits teams with scheduled releases rather than continuous delivery.",c:"Fresher ah irundha 'In my project I used…' nu un GitHub project la follow panna strategy ah sollu. Poi sollaadha, interviewer follow-up kepaanga."}
],

"<b>VM</b> = oru full separate veedu kattradhu. Own kitchen, own bathroom, own electricity (full OS). Periya cost, build panna time aagum. <b>Container</b> = oru apartment flat. Ellarum same building foundation (host kernel) share pannuvaanga, aana ovvoru flat kum own door and lock. Light weight, seconds la ready.",
"<b>Image</b> = cake recipe + ingredients ellam pack panna box. <b>Container</b> = andha box la irundhu senja actual cake, saapdalaam (run aagudhu). Oru recipe la irundhu 100 cakes seiyalaam. <b>Registry</b> (Docker Hub, ECR) = recipe boxes vekkura supermarket.",
"<b>Dockerfile</b> = recipe step by step: <code>FROM</code> = endha base la start pannanum (plain cake base), <code>COPY</code> = ingredients ulla podu, <code>RUN</code> = mix pannu (install), <code>CMD</code> = ready aanadhum enna pannanum (serve). Ovvoru line um oru <b>layer</b>. Maaraadha layers cache aagum, so build fast aagum.",
"Container ah azhichitaa adhukulla irundha ellam poyidum, sand castle maadhiri. <b>Volume</b> = castle pakkathula vechcha oru safe box. Container poanaalum data (database files) safe ah irukkum. <b>Network</b> = containers kulla pesa oru private phone line. Name vechu kooptaa podhum (e.g. <code>db</code>).",
"Oru app ku web + database + cache nu 3 containers venum na, ovvonnum separate ah run panna kashtam. <b>Docker Compose</b> = oru party plan. Oru <code>docker-compose.yml</code> file la 'yaaru vararaanga, enna venum' nu ezhudhu, <code>docker compose up</code> nu sonna ellarum ready."
],
say:[
{s:"A virtual machine virtualises the hardware, so each VM runs its own full operating system on top of a hypervisor. That makes it heavier, gigabytes in size and minutes to boot. A container virtualises at the OS level, it shares the host's kernel and only packages the app and its dependencies, so it's megabytes in size and starts in seconds. VMs give stronger isolation, containers give speed and density. In practice we often run containers on top of VMs, like Docker on EC2 or EKS worker nodes.",c:"Kadaisi line ('containers run on VMs') sonna, rendum competitors illa nu purinjirukkaan nu theriyum."},
{s:"COPY just copies files from the build context into the image. ADD does the same but can also extract local tar files and download from URLs, so best practice is to use COPY unless I specifically need that. CMD sets the default command, and it can be overridden easily at docker run. ENTRYPOINT sets the main executable that always runs. A common pattern is ENTRYPOINT for the executable and CMD for default arguments, so users can change the arguments but not the program.",c:"Rendu question oru answer la. 'Prefer COPY' and 'ENTRYPOINT + CMD pattern' rendum sollu."},
{s:"I start with a small base image like alpine, slim or distroless. I use multi-stage builds, so compilers and build tools stay in the build stage and only the final artifact goes into the runtime image. I combine RUN commands and clean the package cache in the same layer, add a .dockerignore so things like node_modules and .git don't go into the context, and install only production dependencies. In one example, a multi-stage build took a Node image from around 1 GB down to about 150 MB.",c:"Multi-stage build thaan number one point. Un lab la size reduce panna number ah sonna romba strong."},
{s:"Containers use two Linux kernel features. Namespaces give each container its own view of the system: its own process IDs, network interfaces, mount points, hostname and users. Cgroups limit and account for resources like CPU and memory, so one container can't starve the others. On top of that there's a layered filesystem, and security features like capabilities and seccomp restrict what the container can do.",c:"'Namespaces = what you can see, cgroups = how much you can use' nu oru line la sollu."},
{s:"I use small, trusted base images and pin versions. I run as a non-root user with the USER instruction. I never put secrets in the image or Dockerfile, they come at runtime from a secrets manager. I scan images for vulnerabilities with tools like Trivy in the CI pipeline and fail the build on critical issues. At runtime I drop unnecessary Linux capabilities, use a read-only filesystem where possible, and set CPU and memory limits.",c:"Build time (image) and run time (container) nu rendu part ah pirichi sollu. Organised ah theriyum."}
],

kid:[
"Kubernetes = oru periya <b>school</b>. <b>Control plane</b> = principal office: <b>API server</b> = reception (ellam inga dhaan pogum), <b>etcd</b> = register book (ellam ezhudhi vechirukkum), <b>scheduler</b> = 'indha student endha class ku' nu decide panravar, <b>controller manager</b> = rounds pora supervisor. <b>Worker nodes</b> = classrooms. Ovvoru class layum <b>kubelet</b> = class teacher, students (pods) ah paathukkuvaar.",
"<b>Pod</b> = oru student (oru illa konjam containers). <b>ReplicaSet</b> = 'class la eppovum 3 students irukkanum' nu rule. Oruthar poanaa pudhusa oruthar varuvaanga. <b>Deployment</b> = andha rule ah manage panra head master. Pudhu uniform (new version) maathanum na, oruthar oruthar ah maathuvaar (rolling update), problem na pazhaya uniform ku thirumba (rollback).",
"Pods vandhu poittu irukkum, avanga IP maaridum. <b>Service</b> = class oda fixed phone number. Yaar class la irundhaalum, andha number ku call panna connect aagum, load um share aagum. <b>Ingress</b> = school main gate security. '/api' na indha class, '/web' na andha class nu veliya irundhu varavanga ah route pannum.",
"<b>ConfigMap</b> = notice board (normal settings). <b>Secret</b> = locked envelope (passwords). <b>Liveness probe</b> = 'nee uyiroda irukkiya?' illana restart. <b>Readiness probe</b> = 'nee class edukka ready ah?' illana traffic anuppa maataanga. <b>HPA</b> = students adhigama vandha (CPU high), extra teachers (pods) automatic ah add pannum.",
"Pod problem states ah doctor report maadhiri padi: <b>Pending</b> = class la seat illa (no resources), <b>ImagePullBackOff</b> = book (image) kidaikkala (wrong name/no access), <b>CrashLoopBackOff</b> = start aagi udane mayakkam pottu vizhudhu, thirumba thirumba (app error), <b>OOMKilled</b> = adhigama saapttu vayiru vedichiduchu (memory limit cross). Medicine: <code>describe</code>, <code>logs</code>, <code>get events</code>."
],
say:[
{s:"Kubernetes has a control plane and worker nodes. The control plane has the API server, which is the front door for every request, etcd, which is the key-value store holding the cluster state, the scheduler, which decides which node a new pod runs on, and the controller manager, which runs control loops to keep the actual state matching the desired state. Each worker node runs the kubelet, which starts and monitors pods, kube-proxy for service networking, and a container runtime like containerd. When I run kubectl apply, the API server stores the desired state in etcd, the scheduler assigns the pod to a node, and the kubelet on that node starts it.",c:"Components list pannitu, 'kubectl apply panna enna nadakkum' flow sonna, adhu dhaan 9/10 answer."},
{s:"A Deployment is for stateless apps. Pods are interchangeable, it handles rolling updates and rollbacks, like a web API. A StatefulSet is for stateful apps like databases or Kafka. Each pod gets a stable name like db-0, db-1, its own persistent volume, and they start and stop in order. A DaemonSet runs exactly one pod on every node, or on selected nodes, which is used for things like log collectors, monitoring agents or node-exporter.",c:"Moonu kum oru example kandippa. Web API / database / log agent."},
{s:"Through labels and selectors. The pods have labels, for example app equals web, and the Service has a selector that matches those labels. Kubernetes keeps an EndpointSlice updated with the IPs of the matching pods that are ready, meaning they passed the readiness probe. kube-proxy then programs iptables or IPVS rules on each node, so traffic to the Service's cluster IP is load balanced across those pod IPs. If a Service has no endpoints, the first thing I check is whether the labels actually match.",c:"'Readiness pass aana pods mattum dhaan' and 'labels match aagudhaa check pannuven' rendum add pannu, practical ah theriyum."},
{s:"Requests are what the scheduler reserves for the container. A pod is only placed on a node that has that much CPU and memory free. Limits are the maximum it can use. If a container goes over its CPU limit, it gets throttled. If it goes over its memory limit, the kernel kills it, and that's OOMKilled, exit code 137. To fix it, I check actual usage with kubectl top or Grafana, look for a memory leak, and then either fix the app or set the memory request and limit to realistic values.",c:"'CPU = throttle, memory = kill' indha difference ah clear ah sollu. Exit code 137 sonna bonus."},
{s:"I use a Deployment with a RollingUpdate strategy, typically maxUnavailable zero and maxSurge one, so a new pod comes up before an old one goes down. I make sure there's a proper readiness probe, so traffic only goes to pods that are actually ready. I add a preStop hook and a reasonable terminationGracePeriod so in-flight requests finish. I run at least two or three replicas with a PodDisruptionBudget. And if something goes wrong, kubectl rollout undo takes me back, or for risky changes I use canary with Argo Rollouts.",c:"Readiness probe sollalana answer incomplete. Adhu dhaan main key."}
],

"<b>CI</b> (Continuous Integration) = ovvoru student um homework submit pannadhum, teacher udane check pannuvaanga (build + test). Mistakes seekiram theriyum. <b>Continuous Delivery</b> = check pannadhum 'ready to publish' nu shelf la vechiduvaanga, principal 'OK' sonna release. <b>Continuous Deployment</b> = principal kooda venaam, test pass aana automatic ah release.",
"Pipeline = factory assembly line. <b>Code push</b> → <b>build</b> (parts join pannu) → <b>test</b> (quality check) → <b>scan</b> (safety check) → <b>package</b> (Docker image box) → <b>deploy to staging</b> (trial shop) → <b>deploy to prod</b> (real shop). Edhaavadhu step fail aanaa line nikkum, thappu product veliya pogaadhu.",
"<b>GitHub Actions</b> = un repo kulla irukura robot. <code>.github/workflows/</code> la oru YAML file ezhudhu: <b>on</b> = eppo start aaganum (push, PR), <b>jobs</b> = enna velai, <b>steps</b> = step by step instructions, <b>runs-on</b> = endha computer la. <b>Secrets</b> = robot ku mattum theriyura locked passwords.",
"<b>Jenkins</b> = pazhaya, romba powerful robot. Nammale server la install pannanum. <b>Jenkinsfile</b> la pipeline ezhudhuvom (stages, steps). <b>Controller</b> = boss, <b>agents</b> = velai seiyuravanga. Plugins mooolama ellathukkum connect aagum. Niraya companies la innum use panraanga.",
"Pudhu version release panna 3 vazhi: <b>Rolling</b> = konjam konjam servers ah maathradhu. <b>Blue-green</b> = rendu same kadai. Blue la customers irukkaanga, green la pudhu version ready pannu, switch ah flip pannu. Problem na udane blue ku thirumba. <b>Canary</b> = coal mine canary bird maadhiri. Mudhalla 5% customers ku mattum pudhu version, nalla irundha 25%, 50%, 100%."

say:[
{s:"In my project, I built a pipeline with GitHub Actions. On every pull request, it runs linting and unit tests, and blocks the merge if anything fails. On merge to main, it builds a Docker image tagged with the commit SHA, scans it with Trivy, and pushes it to Amazon ECR. Then it deploys to a staging environment automatically and runs a smoke test. Production deployment needs a manual approval through a GitHub environment. AWS access uses OIDC, so there are no long-lived keys stored in the repo. If the smoke test fails, the deploy step rolls back to the previous image.",c:"Idhu 100% kekkura question. Un actual lab pipeline ah STAR illaama straight ah 'trigger → stages → deploy → rollback → security' nu sollu. Poi tools sollaadha."},
{s:"Both reduce deployment risk. In blue-green, I run two identical environments. Blue serves live traffic, I deploy the new version to green, test it, then switch all traffic at once, for example by changing the load balancer target group. Rollback is instant, just switch back, but it costs double the infrastructure during the release. In canary, I send a small percentage of real traffic, like 5 percent, to the new version, watch error rates and latency, and gradually increase it. It catches problems with less impact, but it needs good monitoring and takes longer.",c:"Trade-off (cost vs gradual) sollu. Interviewer 'which one would you pick?' nu ketta: 'depends on risk and monitoring maturity' nu sollu."},
{s:"First I stop the bleeding, then investigate. In Kubernetes, kubectl rollout undo takes me back to the previous ReplicaSet. If we deploy with GitOps, I revert the commit in Git and Argo CD syncs it. In blue-green I switch traffic back, and in canary I abort the rollout. That's why I always deploy immutable, versioned images, so the previous version is always available. Database migrations need care, so we make them backward compatible. After rolling back, I find the root cause and add a test so it's caught in CI next time.",c:"'Rollback first, debug later' ndra mindset dhaan SRE answer."},
{s:"Secrets never go in the code or the repo. In GitHub Actions I store them as encrypted repository or environment secrets, and they're masked in the logs. For AWS access I prefer OIDC, so the pipeline assumes an IAM role with short-lived credentials instead of storing access keys. Application secrets live in AWS Secrets Manager or Parameter Store, or HashiCorp Vault, and are fetched at runtime. I also scope them per environment, rotate them, and run secret scanning like gitleaks in the pipeline.",c:"OIDC sonna romba strong answer. Fresher kitta idhu expect panna maataanga."},
{s:"GitOps means Git is the single source of truth for the desired state of the infrastructure and applications. Instead of the pipeline pushing changes to the cluster, an agent like Argo CD or Flux runs inside the cluster, watches a Git repo, and pulls and applies any change. If someone changes something manually, it detects the drift and corrects it. Every change is a pull request, so we get review, an audit trail, and rollback is just a git revert.",c:"'Push vs pull' difference and 'rollback = git revert' sollu."}
],
lab:{title:"Auto-deploy this game to GitHub Pages with GitHub Actions",time:"30 min",cost:"Free",need:"The GitHub repo from the Git lab",
goal:"Main branch ku push panna, GitHub Actions automatic ah check panni, un game ah internet la host pannum. Idhu dhaan un first real CI/CD pipeline, and un game ku public link kidaikkum!",
steps:[
{t:"Turn on Pages with Actions",d:"GitHub la un repo → <b>Settings</b> → <b>Pages</b> → <b>Source</b>: <b>GitHub Actions</b> select pannu.",c:``},
{t:"Write the workflow",d:"Repo la <code>.github/workflows/deploy.yml</code> create pannu. Rendu jobs: <b>check</b> (CI) and <b>deploy</b> (CD). Check fail aana deploy nadakkaadhu.",c:`name: CI-CD
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html exists and has a doctype
        run: |
          test -f index.html
          head -1 index.html | grep -qi "<!doctype html>"
      - name: No secrets committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4`},
{t:"Push and watch",d:"Push pannitu GitHub la <b>Actions</b> tab paaru. Green tick vandhadhum link click pannu: <code>https://&lt;user&gt;.github.io/oncall-quest/</code>",c:`git add .github/workflows/deploy.yml
git commit -m "Add CI/CD pipeline"
git push`},
{t:"Break the build on purpose",d:"Oru branch la doctype line ah remove pannitu PR open pannu. <b>check</b> job fail aagum, deploy nadakkaadhu. Idhu dhaan CI oda use. Apram fix pannu.",c:`git switch -c test/break-ci
# delete the first line (<!doctype html>) of index.html
git commit -am "Break the check"
git push -u origin test/break-ci
# open a PR -> watch it fail -> close it`},
{t:"Protect main",d:"<b>Settings → Branches → Add rule</b> (or Rulesets) → main → 'Require a pull request' and 'Require status checks: check'. Ippo test fail aana yaarum main la merge panna mudiyaadhu.",c:``},
{t:"Bonus: build and push a Docker image in CI",d:"Docker lab image ah CI la build panni Docker Hub ku push pannu. Repo Settings → Secrets → <code>DOCKERHUB_USERNAME</code>, <code>DOCKERHUB_TOKEN</code> add pannu. Indha job ah workflow la serthukko.",c:`  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKERHUB_USERNAME }}
          password: \${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: \${{ secrets.DOCKERHUB_USERNAME }}/oncall-quest:\${{ github.sha }}`}
],

"Lego house kattumbodhu, instruction booklet irundha, 100 thadava same house katta mudiyum, thappu varaadhu. <b>Infrastructure as Code</b> = cloud servers, networks ellam kai la click pannaama, oru instruction file la ezhudhuradhu. Git la save aagum, review pannalaam, delete aanaalum 5 minutes la thirumba create pannalaam.",
"Terraform workflow = samayal maadhiri. <code>init</code> = paathiram, ingredients ellam ready pannu (providers download). <code>plan</code> = 'enna samaikka poren' nu menu paaru, edhuvum innum seiyala. <code>apply</code> = actual ah samai (resources create). <code>destroy</code> = ellam clean pannu. <b>Plan ah eppovum padichitu dhaan apply.</b>",

"Terraform = <b>veedu kattuvaan</b> (servers, network create pannum). <b>Ansible</b> = <b>interior decorator</b>. Veedu kattinadhum ulla poi furniture podu, paint adi (software install, config files). Agent install panna venaam, SSH vazhiya pogum. <b>Playbook</b> = 'enna enna pannanum' list, <b>idempotent</b> = 10 thadava run pannaalum result same."

say:[
{s:"Terraform state is a file that maps the resources in my code to the real resources in the cloud, with their IDs and attributes. Terraform uses it to work out what needs to be created, changed or destroyed when I run plan. Because it's so important, and it can contain sensitive values, I never keep it locally or in Git for team work. I use a remote backend, an S3 bucket with versioning and encryption, with state locking, using a DynamoDB table or the newer S3 native locking, so two people can't apply at the same time and corrupt it.",c:"'Remote backend + locking + encryption' moonum sollu. Idhu dhaan expected keywords."},
{s:"Both create multiple copies of a resource. count creates them by index, 0, 1, 2. The problem is if I remove an item from the middle of the list, the indexes shift and Terraform destroys and recreates the ones after it. for_each works with a map or a set of strings and keys each resource by name, so adding or removing one item only affects that item. So I use count for simple on/off or 'N identical copies', and for_each when the resources have identity, like a set of users, buckets or subnets.",c:"'Middle item remove panna index shift aagum' ndra problem ah sonna, nee real ah use panni irukka nu theriyum."},
{s:"I keep the infrastructure in reusable modules, like a VPC module, an EKS module and an RDS module. Then each environment has its own folder, or root module, that calls the same modules with different variables in a tfvars file, for example smaller instance types in dev. Each environment has its own separate state file and backend key, ideally in separate AWS accounts, so a mistake in dev can never touch prod. Changes go through a pull request with terraform plan in CI, and prod applies need approval.",c:"Workspaces pathi ketta: 'small setups ku OK, but separate folders/state safer for prod' nu sollu."},
{s:"I use terraform import. First I write the resource block in my code that matches the existing resource, then import it into the state using its ID. Since Terraform 1.5 there's also an import block, which I can put in the code and it can even generate the configuration for me with plan and generate-config-out. After importing, I run terraform plan and keep adjusting the code until the plan shows no changes, which confirms the code matches reality.",c:"'Plan shows no changes varaikkum adjust pannuven' ndra last step dhaan important."},
{s:"Terraform is mainly for provisioning infrastructure, like VPCs, EC2 instances, databases and IAM. It's declarative and tracks state, so it knows what exists. Ansible is mainly for configuration management, like installing packages, managing config files and deploying apps on servers. It's agentless over SSH and runs playbooks of tasks, without a state file. They complement each other: Terraform creates the servers, and Ansible configures them. These days, with containers and immutable images, a lot of the Ansible-style work moves into Dockerfiles or Packer images.",c:"'Competitors illa, team-mates' nu sollu. Veedu kattuvaan vs decorator analogy mind la vechukko."}
],

{t:"Connect the CLI to AWS",d:"IAM user oda access key and secret kudu. Region <code>ap-south-1</code> (Mumbai) Chennai ku pakkam.",c:`aws configure

{t:"Create drift on purpose",d:"Console la bucket oda tags la oru tag ah manually delete pannu. Apram plan run pannu. Terraform 'code la irukkuradhu vs real' difference ah kandupidikkum. Apply panna thirumba correct aagum.",c:`terraform plan -var="bucket_name=yourname-tf-lab-4821"`},
{t:"Ansible: configure a machine",d:"WSL Ubuntu la Ansible install panni localhost mela oru playbook run pannu. <b>Rendu thadava</b> run pannu: first time <code>changed</code>, second time <code>ok</code> (changed=0). Adhu dhaan idempotency.",c:`sudo apt install ansible -y

"AWS = ulagam fulla irukura periya <b>warehouses</b>. <b>Region</b> = oru city (Mumbai = ap-south-1). <b>Availability Zone</b> = andha city la separate ah irukura 3+ buildings, own power, own network. Oru building la fire vandhaalum matha building la un app odum. <b>Edge locations</b> = city la irukura chinna delivery shops (CloudFront), customers kitta fast ah deliver panna.",
"<b>IAM</b> = office security. <b>User</b> = oru person ku ID card (long-term). <b>Group</b> = 'developers' team, team ku orey rules. <b>Role</b> = temporary visitor badge. EC2 or Lambda maadhiri services 'konja neram' S3 access venum na role eduthukkum, password illaama. <b>Policy</b> = 'indha card la endha doors open aagum' nu ezhudhina rule paper (JSON). <b>Root</b> = building owner oda master key, adha locker la vechidu.",
"<b>EC2</b> = AWS kitta vaadagai ku edukura computer. <b>AMI</b> = computer la enna OS/software irukkanum nu template. <b>Instance type</b> = computer size (t3.micro = chinna, m5.xlarge = periyadhu). <b>Key pair</b> = un computer kulla poga saavi. <b>User data</b> = computer on aanadhum first time automatic ah run aagura script.",
"EC2 ku pay panra vazhi = travel maadhiri. <b>On-Demand</b> = auto, meter podu, eppo venumnaalum niruthalaam (costly). <b>Reserved / Savings Plans</b> = monthly bus pass, 1-3 years commit, 70% varaikkum discount. <b>Spot</b> = last minute empty seat, 90% cheap, aana AWS ku venumnaa 2 min notice la irangha solliduvaanga. <b>Dedicated</b> = full car unakku mattum.",
"<b>Security Group</b> = un EC2 oda personal bodyguard. 'Indha IP la irundhu port 22 ku vara vidu' nu allow list mattum. Ulla vandhavan reply panna automatic ah veliya vidum (<b>stateful</b>). <b>EBS</b> = EC2 ku attach panra hard disk. <b>Instance store</b> = temporary disk, machine stop pannaa data poidum."
],
say:[
{s:"An IAM user is an identity with long-term credentials, a password for the console or access keys, and it's meant for a specific person or, rarely, an application. An IAM role has no long-term credentials. It's assumed by someone or something, like an EC2 instance, a Lambda function, a user from another account, or a CI pipeline through OIDC, and it gives temporary credentials through STS that expire automatically. Best practice is to use roles wherever possible, for example an instance profile so the app on EC2 can read S3 without any access keys on the server.",c:"'Temporary credentials' ndra word kandippa varanum. EC2 + S3 example sollu."},
{s:"Least privilege means giving an identity only the permissions it needs to do its job, and nothing more. In practice I start with no access and add specific actions on specific resources, for example s3:GetObject on one bucket instead of s3:*. I use roles and groups instead of attaching policies to individual users, add conditions like source IP or MFA where needed, and use IAM Access Analyzer and last-accessed data to find and remove unused permissions. In bigger setups, Service Control Policies in AWS Organizations set guardrails across accounts.",c:"'s3:* badhila s3:GetObject on one bucket' ndra example dhaan answer ah strong aakkum."},
{s:"First I enable MFA on the root account, ideally a hardware key. I make sure the root user has no access keys at all. I create an admin IAM user or use IAM Identity Center for daily work, and only use root for the few tasks that actually need it, like changing the support plan. I set a strong password, keep the root email secure, set up billing alerts, and enable CloudTrail so any root activity is logged, with an alarm if root ever logs in.",c:"'MFA, no access keys, daily use pannaadha, CloudTrail alarm' indha 4 points."},
{s:"There are four main models. On-Demand is pay per second with no commitment, good for short-term or unpredictable workloads. Reserved Instances and Savings Plans give up to about 70 percent discount in exchange for a one or three year commitment, good for steady production workloads. Spot Instances use spare capacity at up to 90 percent off, but AWS can reclaim them with a two-minute warning, so they suit fault-tolerant work like batch jobs, CI runners or stateless workers in an Auto Scaling group. And Dedicated Hosts are for licensing or compliance needs. In a real setup I'd mix them: Savings Plans for the baseline and Spot for burst capacity.",c:"Kadaisi line ('mix them') sonna cost-aware engineer nu theriyum. Companies ku adhu romba pidikkum."},
{s:"I'd go through it step by step. First, is the instance running and are the status checks passing? Then the security group: does it allow port 22 from my current IP? Then the network: is it in a public subnet with a route to an internet gateway, and does it have a public IP? Then the network ACL, which is stateless, so it needs the ephemeral return ports allowed too. Then the SSH side: correct key file, permission 400 on the key, and the right username, like ec2-user for Amazon Linux or ubuntu for Ubuntu. If it's still failing, I use EC2 Instance Connect or Session Manager, or check the system log for boot problems like a full disk.",c:"Outside → inside order: instance → SG → route/IP → NACL → key/user → logs. Idha order ah sonna full marks."}
],
lab:{title:"Secure AWS account, launch EC2, serve a website, use a role",time:"60 min",cost:"Free tier (t2.micro/t3.micro). Terminate at the end",need:"An AWS account (needs a card), a phone authenticator app",
goal:"Mudhalla account ah secure pannu (bill shock varaama). Apram oru EC2 launch panni, SSH panni, nginx la web page serve panni, access keys illaama IAM role la S3 access pannu.",
steps:[
{t:"Lock the root account",d:"Root user ah login pannu → top right name → <b>Security credentials</b> → <b>Assign MFA</b> → Authenticator app. Root ku access keys irundha delete pannu. <b>Idhu dhaan first, skip pannaadha.</b>",c:``},
{t:"Set a budget alarm",d:"<b>Billing and Cost Management → Budgets → Create budget</b> → 'Zero spend budget' template → un email. 1 cent selavaanaalum mail varum. Bill shock ku idhu dhaan medicine.",c:``},
{t:"Create your admin user",d:"<b>IAM → Users → Create user</b> → name <code>admin-you</code> → console access → <b>Attach policies directly</b> → <code>AdministratorAccess</code>. Indha user ku um MFA podu. Ini daily idha mattum use pannu, root illa. CLI ku venum na <b>Security credentials → Create access key</b>.",c:`aws configure
aws sts get-caller-identity   # should show admin-you, not root`},
{t:"Launch an EC2 instance",d:"<b>EC2 → Launch instance</b>: name <code>web-lab</code>, AMI <b>Amazon Linux 2023</b>, type <b>t2.micro / t3.micro</b> (Free tier eligible label paaru), new key pair <code>lab-key</code> (.pem download aagum), Security group: SSH from <b>My IP</b>, HTTP from Anywhere. <b>Advanced → User data</b> la idha paste pannu:",c:`#!/bin/bash
dnf install -y nginx
echo "<h1>Hello from EC2 - $(hostname -f)</h1>" > /usr/share/nginx/html/index.html
systemctl enable --now nginx`},
{t:"Connect and check",d:"Browser la <code>http://&lt;public-ip&gt;</code> open pannu, un page varum. SSH: Windows PowerShell la. Key permission error vandha, EC2 console → <b>Connect → EC2 Instance Connect</b> use pannu.",c:`ssh -i lab-key.pem ec2-user@<public-ip>
# inside the instance
systemctl status nginx --no-pager
curl -s http://169.254.169.254/latest/meta-data/instance-type -H "X-aws-ec2-metadata-token: $(curl -s -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')"
aws s3 ls     # fails: no credentials. Good!`},
{t:"Give it a role, not keys",d:"<b>IAM → Roles → Create role</b> → Trusted entity <b>AWS service → EC2</b> → policy <code>AmazonS3ReadOnlyAccess</code> → name <code>ec2-s3-read</code>. EC2 → instance → <b>Actions → Security → Modify IAM role</b> → attach. Thirumba SSH la try pannu, ippo work aagum, keys illaama!",c:`aws s3 ls
aws sts get-caller-identity   # shows assumed-role/ec2-s3-read/...`},
{t:"Break SSH and fix it",d:"Security group la SSH rule ah delete pannu. SSH try pannu, hang aagum (timeout). Rule thirumba add pannu, work aagum. Indha 'cannot SSH' interview question ku un real story ready.",c:``}
],
verify:["Root la MFA on, budget alarm set","Browser la EC2 page theriyudhu","Role attach pannadhum <code>aws s3 ls</code> keys illaama work aachu"],

"<b>VPC</b> = AWS la unakku mattum irukura oru private <b>gated colony</b>. <b>CIDR</b> (10.0.0.0/16) = colony la evlo plots irukku. <b>Subnet</b> = colony kulla streets. <b>Public subnet</b> = main road pakkathula irukura street (veliya ponaa udane road), <b>private subnet</b> = ulla irukura safe street (database inga). Ovvoru subnet um oru AZ la dhaan irukkum.",
"<b>Internet Gateway</b> = colony oda main gate. Rendu side um poga varalaam. Public subnet ku idhu. <b>NAT Gateway</b> = one-way door. Private street la irukuravanga veliya poi shopping (software updates) pannalaam, aana veliya irundhu yaarum ulla vara mudiyaadhu. NAT public subnet la irukkum, adhukku per hour charge undu.",
"<b>Security Group</b> = ovvoru veetu vaasal la bodyguard. Allow list mattum, ulla vandhavan reply ah automatic ah veliya vidum (stateful). <b>NACL</b> = street entrance la checkpost. Allow and deny rendum sollalaam, rules number order la check aagum, aana stateless, so poradhu varadhu rendukkum separate rule venum.",
"Oru hotel la oru waiter mattum irundha, crowd vandha collapse. <b>Load Balancer</b> = reception manager, customers ah free ah irukura waiters (servers) kitta anuppuvaar. Waiter udambu sari illana (health check fail) avar kitta anuppa maattaar. <b>ALB</b> = smart manager, menu paathu (URL path, host) anuppuvaar (L7). <b>NLB</b> = super fast, address mattum paathu anuppuvaar (L4, TCP).",
"<b>Route 53</b> = AWS oda DNS phonebook. <code>myapp.com</code> → load balancer. Health check panni, oru region down na innoru region ku anuppa mudiyum (failover). <b>VPC Peering</b> = rendu colonies ku naduvula private bridge. <b>Transit Gateway</b> = periya bus stand, 100 colonies um onnu kooda connect aagalaam. <b>VPN / Direct Connect</b> = un office ah AWS oda connect panra private road."
],
say:[
{s:"I'd create a VPC, say 10.0.0.0/16, across at least two Availability Zones for high availability. In each AZ, I'd have three subnet tiers. Public subnets hold the Application Load Balancer and NAT Gateways, with a route to the Internet Gateway. Private app subnets hold the EC2 instances or containers in an Auto Scaling group, with outbound internet through the NAT Gateway. Private data subnets hold RDS in Multi-AZ, with no internet route at all. Security groups chain the tiers: the ALB allows 443 from the internet, the app tier only allows traffic from the ALB's security group, and the database only allows its port from the app security group. I'd add VPC endpoints for S3 to avoid NAT costs, and flow logs for visibility.",c:"Paper la draw panni pesu (whiteboard). '2 AZs, 3 tiers, SG chaining' indha 3 keywords mukkiyam."},
{s:"A security group works at the instance or network interface level, it's stateful, so return traffic is allowed automatically, and it only has allow rules. A network ACL works at the subnet level, it's stateless, so I need rules for both inbound and outbound, including ephemeral ports for responses, and it supports both allow and deny rules, evaluated in order by rule number. I use security groups as the main control, and NACLs as an extra layer, for example to explicitly block a malicious IP range for a whole subnet.",c:"Table maadhiri moonu differences: level, stateful/stateless, allow/deny. Apram 'block a bad IP' example."},
{s:"An Internet Gateway gives two-way internet access to resources in a public subnet that have a public IP. Anything on the internet can reach them, if the security group allows it. A NAT Gateway gives outbound-only internet access to resources in private subnets, so they can download updates or call external APIs, but nothing on the internet can start a connection to them. The NAT Gateway itself sits in a public subnet and uses the Internet Gateway. It's managed and highly available within an AZ, but it costs per hour plus per GB, so I deploy one per AZ in production, and I use VPC endpoints for S3 and DynamoDB to reduce that traffic.",c:"'NAT costs money, use VPC endpoints' ndra cost point sonna senior level answer."},
{s:"An Application Load Balancer works at layer 7. It understands HTTP and HTTPS, so it can route based on the path, host name, headers or query strings, and it supports things like WebSockets, redirects and authentication. It's what I'd use for web apps and microservices. A Network Load Balancer works at layer 4 with TCP and UDP. It's built for very high performance and ultra-low latency, it supports static IPs or Elastic IPs per AZ, and it preserves the client IP. I'd use it for non-HTTP protocols, gaming or IoT, or when a client needs to whitelist a fixed IP.",c:"Ovvonnukkum 'eppo use pannuven' sollu. 'Static IP venum na NLB' romba common follow-up."},
{s:"VPC peering is a direct, one-to-one connection between two VPCs. It's simple and cheap, but it's not transitive: if A is peered with B and B with C, A still can't reach C. So with many VPCs, it becomes a mesh that's hard to manage. Transit Gateway is a central hub. Every VPC, VPN and Direct Connect attaches to it once, and routing is managed in one place with route tables. So for two or three VPCs, peering is fine. For many VPCs or accounts, or hybrid connectivity to on-premises, I'd use Transit Gateway.",c:"'Not transitive' ndra word dhaan key. Adha sollalana answer weak."}
],
lab:{title:"Build a custom VPC with public and private subnets",time:"60 min",cost:"Free if you skip the NAT Gateway (it costs ~$1/day). Terminate instances at the end",need:"The AWS account from the IAM lab, a key pair",
goal:"Default VPC use pannaama, nee ae oru VPC design panni build pannu. Public subnet la web server, private subnet la 'database' server. Private server internet la irundhu reach aagaadhu nu prove pannu.",
steps:[
{t:"Create the VPC",d:"<b>VPC → Your VPCs → Create VPC</b> → <b>VPC only</b> → name <code>lab-vpc</code>, IPv4 CIDR <code>10.0.0.0/16</code>.",c:``},
{t:"Create two subnets",d:"<b>Subnets → Create subnet</b> → VPC <code>lab-vpc</code>. Rendu subnets: <code>public-a</code> = <code>10.0.1.0/24</code>, <code>private-a</code> = <code>10.0.2.0/24</code>, rendum same AZ (ap-south-1a). <code>public-a</code> select → <b>Actions → Edit subnet settings → Enable auto-assign public IPv4</b>.",c:``},
{t:"Internet Gateway and routes",d:"<b>Internet gateways → Create</b> → <code>lab-igw</code> → <b>Attach to VPC</b>. <b>Route tables → Create</b> → <code>public-rt</code> → <b>Routes → Edit → Add</b> <code>0.0.0.0/0</code> → target <code>lab-igw</code>. <b>Subnet associations</b> → <code>public-a</code>. Private subnet main route table la irukkum (local route mattum), adhaan private.",c:`# what the route tables look like
public-rt : 10.0.0.0/16 -> local
            0.0.0.0/0   -> igw-xxxx
main rt   : 10.0.0.0/16 -> local      (private-a uses this)`},
{t:"Security groups that chain",d:"<code>web-sg</code>: inbound SSH 22 from My IP, HTTP 80 from 0.0.0.0/0. <code>db-sg</code>: inbound SSH 22 and All ICMP <b>source = web-sg</b> (IP illa, SG ID). Idhu dhaan 'SG chaining', interview la sonna romba impress aaguvaanga.",c:``},
{t:"Launch two instances",d:"<code>web</code>: subnet <code>public-a</code>, SG <code>web-sg</code>, Amazon Linux, t2/t3.micro. <code>db</code>: subnet <code>private-a</code>, SG <code>db-sg</code>, auto-assign public IP <b>Disable</b>. Same key pair.",c:``},
{t:"Prove public vs private",d:"Web ku SSH pannu. Adhula irundhu db oda private IP ku ping pannu (work aagum). Un laptop la irundhu db ku direct ah reach panna mudiyaadhu, public IP ae illa.",c:`ssh -i lab-key.pem ec2-user@<web-public-ip>
ping -c 3 <db-private-ip>          # works: same VPC, SG allows web-sg
curl -s ifconfig.me                # web has internet via IGW`},
{t:"Jump to the private box",d:"Key ah web ku copy panni (lab mattum, real la Session Manager use pannuvom), db ku SSH pannu. Adhula internet try pannu, fail aagum. Indha gap ah fill panradhu dhaan NAT Gateway.",c:`# from your laptop
scp -i lab-key.pem lab-key.pem ec2-user@<web-public-ip>:~
ssh -i lab-key.pem ec2-user@<web-public-ip>
chmod 400 lab-key.pem
ssh -i lab-key.pem ec2-user@<db-private-ip>
curl -m 5 https://aws.amazon.com    # times out: no route to the internet
exit; rm lab-key.pem`}
],

"<b>S3</b> = unlimited size <b>locker room</b>. Edha venumnaalum podalaam (photos, logs, backups). <b>Bucket</b> = un locker (name ulagathulaye unique), <b>object</b> = ulla vechcha porul, <b>key</b> = adhoda name/path. 11 nines durability = million years la oru file kooda tholaiyaadhu nu solra alavu safe. Default ah <b>private</b>, nee open pannaa mattum dhaan matha ellarum paaka mudiyum.",
"<b>EBS</b> = un laptop oda hard disk. Oru EC2 ku mattum attach aagum, fast. <b>EFS</b> = office shared drive, niraya EC2 orey neram use pannalaam (Linux). <b>S3</b> = cloud locker, internet vazhiya (API) edukalaam, disk maadhiri mount aagaadhu. Simple ah: <b>EBS = my disk, EFS = our shared folder, S3 = everyone's warehouse</b>.",
"<b>RDS</b> = AWS paathukkura database. Install, backup, patching ellam AWS pannum, nee data mattum paathukko. <b>Multi-AZ</b> = innoru building la oru photocopy database ready ah irukkum. Main fail aana automatic ah adhu main aagum (safety ku). <b>Read replica</b> = padikka mattum extra copies, crowd adhigama irundha load share pannum (speed ku). <b>Aurora</b> = AWS oda super-charged version.",
"<b>RDS</b> = school register, rows and columns, strict format, joins pannalaam. <b>DynamoDB</b> = periya key-value almirah. 'Roll number 42 kudu' nu sonna milliseconds la kudukkum, evlo crowd vandhaalum. Aana complex questions (joins) kekka mudiyaadhu. <b>ElastiCache</b> (Redis) = teacher table mela vechcha frequently asked answers. Database ku pogaama udane answer."
],
say:[
{s:"S3 Standard is for frequently accessed data, with millisecond access and data in at least three AZs. Intelligent-Tiering automatically moves objects between tiers based on access patterns, so it's great when I don't know the pattern. Standard-IA and One Zone-IA are for infrequently accessed data, cheaper storage but with a retrieval fee, and One Zone keeps data in a single AZ, so only for data I can recreate. Then the Glacier classes for archives: Instant Retrieval for rarely accessed data that still needs milliseconds, Flexible Retrieval with minutes to hours, and Deep Archive, the cheapest, with up to 12 hours retrieval, for compliance data kept for years. I'd automate the movement with lifecycle rules, for example logs go to IA after 30 days, Glacier after 90, and get deleted after a year.",c:"Lifecycle rule example (30 → 90 → delete) kandippa sollu. Adhu dhaan real-world."},
{s:"EBS is block storage attached to a single EC2 instance in one AZ, like a hard disk. It's low latency, and I use it for the OS, databases and anything that needs a filesystem with fast I/O. EFS is a managed NFS file system that many instances, across AZs, can mount at the same time, so it's good for shared content, like a CMS or shared home directories. S3 is object storage accessed over an API, practically unlimited and very durable, used for static files, backups, logs and data lakes, but it isn't mounted as a normal disk.",c:"'One instance / many instances / API' nu oru line la difference sollu, apram examples."},
{s:"They solve different problems. Multi-AZ is for high availability. RDS keeps a synchronous standby in another AZ, and if the primary fails, it automatically fails over, usually in a minute or two, with the same endpoint. The standby doesn't serve traffic. Read replicas are for scaling reads. They use asynchronous replication, can be in the same or another region, and the app sends read queries to their own endpoints. They can be promoted manually, which is also useful for disaster recovery. In production I usually use both: Multi-AZ for availability and replicas for read-heavy traffic.",c:"'Multi-AZ = availability, replica = performance' first line la sollidu."},
{s:"I'd choose DynamoDB when I need single-digit millisecond performance at massive scale with predictable access patterns, like looking up by a key: user sessions, shopping carts, IoT data, gaming leaderboards. It's serverless, scales automatically, and there's nothing to patch. I'd choose RDS when the data is relational, I need complex queries, joins, and transactions across tables, or when the access patterns aren't known yet, like a typical business application with reporting. With DynamoDB you design the table around your queries upfront.",c:"'Access pattern theriyum na DynamoDB, complex queries/joins na RDS' nu sollu."},
{s:"I keep Block Public Access turned on at both the account and bucket level. I control access with IAM policies and bucket policies following least privilege, and disable ACLs with bucket owner enforced. I enable default encryption with SSE-S3 or SSE-KMS, and enforce HTTPS with a bucket policy that denies requests where aws:SecureTransport is false. I turn on versioning, and Object Lock for critical data, to protect against deletion or ransomware. For sharing, I use pre-signed URLs or CloudFront with Origin Access Control instead of making the bucket public. And I log access with CloudTrail and server access logs, and use Macie to find sensitive data.",c:"'Never make it public, use CloudFront OAC or presigned URL' ndra point dhaan main. Layered ah sollu: access → encryption → versioning → logging."}
],
lab:{title:"S3: private bucket, presigned URLs, versioning, lifecycle and a CDN",time:"45 min",cost:"Free tier (a few KB). Delete at the end",need:"AWS CLI configured (from the IAM lab), the game's index.html",
goal:"Oru bucket create panni, adhu private nu prove pannu, presigned URL la temporary ah share pannu, versioning la delete aana file ah recover pannu, lifecycle rule podu. Bonus: un game ah CloudFront la host pannu.",
steps:[

echo "secret report" > report.txt
aws s3 cp report.txt s3://yourname-data-lab-4821/

{t:"Prove it is private",d:"Object URL ah browser la open pannu. <b>AccessDenied (403)</b> varum. Correct! Networking zone la padicha 403 ivlo dhaan.",c:`https://yourname-data-lab-4821.s3.ap-south-1.amazonaws.com/report.txt`},
{t:"Share it safely with a presigned URL",d:"5 minutes mattum work aagura link. Browser la open pannu, file varum. 5 min apram try pannu, expire aagidum.",c:`aws s3 presign s3://yourname-data-lab-4821/report.txt --expires-in 300`},
{t:"Versioning saves you",d:"Versioning on pannu, file ah overwrite pannu, delete pannu. Apram pazhaya version ah thirumba kondu vaa. Ransomware / accidental delete ku idhu dhaan rescue.",c:`aws s3api put-bucket-versioning --bucket yourname-data-lab-4821 --versioning-configuration Status=Enabled
echo "v2 changed" > report.txt

# copy the VersionId of the first (oldest) version, then:

{t:"Add a lifecycle rule",d:"Console → bucket → <b>Management → Create lifecycle rule</b>: prefix <code>logs/</code>, transition to <b>Standard-IA after 30 days</b>, <b>Glacier Flexible Retrieval after 90</b>, <b>expire after 365</b>, noncurrent versions delete after 30 days. Cost saving ku idhu dhaan.",c:``},
{t:"Bonus: host the game with CloudFront (still private bucket)",d:"Pudhu bucket la <code>index.html</code> upload pannu. <b>CloudFront → Create distribution</b> → origin = un bucket → <b>Origin access: Origin access control (OAC)</b> → create → CloudFront kudukkura bucket policy ah copy panni bucket la paste pannu → <b>Default root object</b> = <code>index.html</code>. 5-10 min la <code>https://dxxxx.cloudfront.net</code> la game odum, bucket private ah dhaan irukkum!",c:`aws s3 mb s3://yourname-quest-site-4821
aws s3 cp index.html s3://yourname-quest-site-4821/`}
],

"Saapadu kadai la lunch time la crowd adhigam, night la kammi. <b>Auto Scaling Group</b> = crowd adhigam aana automatic ah extra cooks (EC2) varuvaanga, kammi aana veetuku poiduvaanga. <b>Min</b> = eppovum irukkanum (2), <b>max</b> = adhukku mela venaam (10), <b>desired</b> = ippo evlo. Oru cook udambu sari illana (health check fail), pudhu cook replace pannuvaanga.",
"<b>Lambda</b> = call taxi. Car vaangaa venaam, maintain panna venaam. Call pannaa (event) varum, trip mudinjadhum poiyidum. Ride ku mattum pay (per request + milliseconds). Server ae yosikka venaam, adhaan <b>serverless</b>. Max 15 minutes trip dhaan. <b>Cold start</b> = first call ku taxi garage la irundhu vara konjam time aagum.",
"<b>SQS</b> = hotel order ticket rack. Waiter ticket ah rack la vechiduvaar, cook free aanadhum oru oru ah eduthu samaipaar. Rush aanaalum ticket tholaiyaadhu (decoupling). <b>SNS</b> = school announcement speaker, orey message ellarukkum (email, SMS, SQS, Lambda). <b>EventBridge</b> = smart post office, 'indha type event na indha address ku' nu rules vechu route pannum, schedule (cron) kooda pannum.",
